      /* ---------- Flow Interactive SVG Renderer ---------- */
      function computeNodePositions(nodes) {
        const n = nodes.length;
        if (n === 2) return { [nodes[0].id]: { x: 165, y: 120 }, [nodes[1].id]: { x: 435, y: 120 } };
        if (n === 3) {
          return {
            [nodes[0].id]: { x: 108, y: 120 },
            [nodes[1].id]: { x: 300, y: 120 },
            [nodes[2].id]: { x: 492, y: 120 },
          };
        }
        const coords = [
          { x: 145, y: 58 },
          { x: 455, y: 58 },
          { x: 145, y: 184 },
          { x: 455, y: 184 },
        ];
        const map = {};
        nodes.slice(0, 4).forEach((nd, i) => { map[nd.id] = coords[i]; });
        return map;
      }

      function clipEdge(p1, p2, hw, hh) {
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        if (dx === 0 && dy === 0) return { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y };
        const t = 1 / Math.max(Math.abs(dx) / hw, Math.abs(dy) / hh);
        return { x1: p1.x + dx * t, y1: p1.y + dy * t, x2: p2.x - dx * t, y2: p2.y - dy * t };
      }

      function buildFlowSvg(card, stepIdx) {
        const nodes = card.nodes || [];
        const step = (card.steps || [])[stepIdx] || { actions: [] };
        const pos = computeNodePositions(nodes);
        const hw = nodes.length === 3 ? 72 : 78;
        const hh = 36;

        const activeNodes = new Set();
        const pulseNodes = new Set();
        const cutNodes = new Set();

        for (const act of step.actions || []) {
          if (act.from) activeNodes.add(act.from);
          if (act.to) activeNodes.add(act.to);
          if (act.node) {
            activeNodes.add(act.node);
            if (act.kind === 'pulse') pulseNodes.add(act.node);
          }
          if (act.kind === 'cut') {
            if (act.from) cutNodes.add(act.from);
            if (act.to) cutNodes.add(act.to);
          }
        }

        const arrowActions = (step.actions || []).filter((a) => a.kind === 'arrow');
        let edgesSvg = '';
        let arrowOrder = 0;

        for (const act of step.actions || []) {
          if (act.kind === 'pulse') continue;
          const p1 = pos[act.from];
          const p2 = pos[act.to];
          if (!p1 || !p2) continue;
          const { x1, y1, x2, y2 } = clipEdge(p1, p2, hw, hh);
          const mx = (x1 + x2) / 2;
          const my = (y1 + y2) / 2;

          if (act.kind === 'arrow') {
            arrowOrder += 1;
            edgesSvg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2563eb" stroke-width="3" stroke-linecap="round" class="edge-flow" marker-end="url(#arrow-blue)" />`;
            if (arrowActions.length > 1) {
              edgesSvg += `<g transform="translate(${mx}, ${my})"><circle r="11" fill="#2563eb" stroke="#f8f5ef" stroke-width="2.5" /><text text-anchor="middle" dy="4" fill="#fff" font-size="11" font-weight="700">${arrowOrder}</text></g>`;
            }
          } else if (act.kind === 'both') {
            edgesSvg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#15803d" stroke-width="3.2" stroke-linecap="round" class="edge-flow" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green)" />`;
          } else if (act.kind === 'cut') {
            edgesSvg += `
              <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6 6" stroke-linecap="round" />
              <g transform="translate(${mx}, ${my})">
                <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
                <text text-anchor="middle" dy="4.5" fill="#dc2626" font-size="12" font-weight="700">✂️ 断开</text>
              </g>
            `;
          }
        }

        const boxW = nodes.length === 3 ? 132 : 140;
        const nodesSvg = nodes.map((nd) => {
          const p = pos[nd.id];
          if (!p) return '';
          const isActive = activeNodes.has(nd.id);
          const isPulse = pulseNodes.has(nd.id);
          const isCut = cutNodes.has(nd.id);

          let stroke = '#e5ded2', fill = '#ffffff', ring = '', badge = '';
          if (isPulse) {
            stroke = '#d97706'; fill = '#fffbeb';
            ring = `<rect x="${p.x - boxW/2 - 5}" y="${p.y - 34}" width="${boxW + 10}" height="68" rx="18" fill="none" stroke="#fcd34d" stroke-width="3" opacity="0.7" />`;
            badge = `<g transform="translate(${p.x}, ${p.y + 44})"><rect x="-46" y="-11" width="92" height="22" rx="11" fill="#fffbeb" stroke="#fde68a" /><text text-anchor="middle" dy="4" fill="#b45309" font-size="11" font-weight="700">⏱️ 关键状态</text></g>`;
          } else if (isCut) {
            stroke = '#dc2626'; fill = '#fef2f2';
          } else if (isActive) {
            const hasBoth = (step.actions || []).some((a) => a.kind === 'both' && (a.from === nd.id || a.to === nd.id));
            stroke = hasBoth ? '#15803d' : '#2563eb';
            fill = hasBoth ? '#f0fdf4' : '#ffffff';
            ring = `<rect x="${p.x - boxW/2 - 4}" y="${p.y - 33}" width="${boxW + 8}" height="66" rx="18" fill="none" stroke="${hasBoth ? '#bbf7d0' : '#bfdbfe'}" stroke-width="3" />`;
          }

          return `
            <g opacity="${isActive ? '1' : '0.28'}">
              ${ring}
              <rect x="${p.x - boxW/2}" y="${p.y - 29}" width="${boxW}" height="58" rx="15" fill="${fill}" stroke="${stroke}" stroke-width="${isActive ? '2.2' : '1.4'}" />
              <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" fill="#1c1917" font-size="15" font-weight="650">${escapeHtml(nd.icon)} ${escapeHtml(nd.label)}</text>
              ${badge}
            </g>
          `;
        }).join('');

        return `
          <svg class="flow-svg" viewBox="0 0 600 246" aria-label="分步流程图">
            <defs>
              <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#2563eb" /></marker>
              <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 1 1 L 9 5 L 1 9 z" fill="#15803d" /></marker>
              <marker id="arrow-green-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M 9 1 L 1 5 L 9 9 z" fill="#15803d" /></marker>
            </defs>
            ${edgesSvg}
            ${nodesSvg}
          </svg>
        `;
      }

      function renderCollapsedDetails(card) {
        const blocks = [];
        if (Array.isArray(card.glossary) && card.glossary.length > 0) {
          blocks.push(`
            <details>
              <summary>展开开发黑话对照 (${card.glossary.length})</summary>
              <div class="glossary-list">
                ${card.glossary.map((g) => `<div class="glossary-item"><span class="glossary-term">${escapeHtml(g.term)}</span><span class="glossary-plain">${escapeHtml(g.plain)}</span></div>`).join('')}
              </div>
            </details>
          `);
        }
        if (Array.isArray(card.tips) && card.tips.length > 0) {
          blocks.push(`
            <details>
              <summary>展开写需求常漏的避坑点 (${card.tips.length})</summary>
              <ul class="tips-list">${card.tips.map((t) => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
            </details>
          `);
        }
        return blocks.length ? `<div class="fold-group">${blocks.join('')}</div>` : '';
      }

      /* ---------- Focus Review Modal ---------- */
      function openModal(ids, idx) {
        sessionIds = ids;
        sessionIdx = idx;
        flowStepIdx = 0;
        isFlipped = false;
        elBackdrop.classList.add('open');
        elBackdrop.setAttribute('aria-hidden', 'false');
        renderModal();
      }

      function closeModal() {
        clearDemoTimers();
        elBackdrop.classList.remove('open');
        elBackdrop.setAttribute('aria-hidden', 'true');
      }

      function renderModal() {
        clearDemoTimers();
        if (!elBackdrop.classList.contains('open') || sessionIds.length === 0) return;
        const card = getCardById(sessionIds[sessionIdx]);
        if (!card) { closeModal(); return; }

        const tm = TYPE_META[card.type] || TYPE_META.flashcard;
        const st = card.status || 'reviewing';

        elModalMeta.innerHTML = `
          <span class="type-pill ${tm.cls}">${tm.icon} ${tm.label}</span>
          ${(card.tags || []).map((t) => `<span class="meta-tag">#${escapeHtml(t)}</span>`).join('')}
          <span class="meta-tag">${sessionIdx + 1} / ${sessionIds.length}</span>
        `;

        elEditCardBtn.style.display = canEdit ? 'inline-block' : 'none';
        elDeleteCardBtn.style.display = canEdit ? 'inline-block' : 'none';

        elModalTitle.textContent = card.title;
        if (card.source) {
          elModalSource.textContent = `出处：${card.source}${card.date ? ` · ${card.date}` : ''}`;
          elModalSource.style.display = 'block';
        } else {
          elModalSource.style.display = 'none';
        }

        if (card.type === 'demo') {
          elModalBody.innerHTML = `
            <div class="demo-stage" id="demoMount"></div>
            ${card.summary ? `<p class="demo-summary">${escapeHtml(card.summary)}</p>` : ''}
            ${card.rule ? `<div class="rule-box">💡 写需求红线：${escapeHtml(card.rule)}</div>` : ''}
            ${renderCollapsedDetails(card)}
          `;
          mountDemo(document.getElementById('demoMount'), card.demo);
          elKbdHint.textContent = '直接点击上方画面交互体验 · ← / → 切换上下张 · Esc 关闭';
        } else if (card.type === 'flow') {
          const steps = card.steps || [];
          flowStepIdx = Math.max(0, Math.min(flowStepIdx, Math.max(0, steps.length - 1)));
          const curStep = steps[flowStepIdx] || { title: '暂无步骤', text: '点右上角「编辑」可补充步骤' };

          elModalBody.innerHTML = `
            <div class="flow-stage">
              ${buildFlowSvg(card, flowStepIdx)}
              <div class="step-caption-box">
                <span class="step-badge">第 ${steps.length ? flowStepIdx + 1 : 0} / ${steps.length} 步 · ${escapeHtml(curStep.title)}</span>
                <p class="step-sentence">${escapeHtml(curStep.text)}</p>
              </div>
              <div class="step-nav">
                <button class="step-arrow-btn" id="stepPrevBtn" ${flowStepIdx === 0 ? 'disabled' : ''}>← 上一步</button>
                <div class="step-pills">
                  ${steps.map((s, i) => `<button class="step-pill ${i === flowStepIdx ? 'active' : ''}" data-step="${i}">${i + 1}. ${escapeHtml(s.title)}</button>`).join('')}
                </div>
                <button class="step-arrow-btn" id="stepNextBtn" ${flowStepIdx >= steps.length - 1 ? 'disabled' : ''}>下一步 →</button>
              </div>
            </div>
            ${renderCollapsedDetails(card)}
          `;

          document.getElementById('stepPrevBtn').onclick = () => { if (flowStepIdx > 0) { flowStepIdx -= 1; renderModal(); } };
          document.getElementById('stepNextBtn').onclick = () => { if (flowStepIdx < steps.length - 1) { flowStepIdx += 1; renderModal(); } };
          elModalBody.querySelectorAll('.step-pill').forEach((btn) => {
            btn.onclick = () => { flowStepIdx = Number(btn.dataset.step); renderModal(); };
          });
          elKbdHint.textContent = '快捷键：← / → 切换步骤 · Esc 关闭';
        } else if (card.type === 'contrast') {
          elModalBody.innerHTML = `
            <div class="contrast-grid">
              <div class="contrast-box contrast-wrong"><div class="contrast-label">❌ 当时容易漏掉</div><p class="contrast-text">${escapeHtml(card.wrong || '')}</p></div>
              <div class="contrast-box contrast-right"><div class="contrast-label">✅ 正确补法</div><p class="contrast-text">${escapeHtml(card.right || '')}</p></div>
            </div>
            ${card.rule ? `<div class="rule-box">💡 下次自检：${escapeHtml(card.rule)}</div>` : ''}
            ${renderCollapsedDetails(card)}
          `;
          elKbdHint.textContent = '快捷键：← / → 切换上下张 · Esc 关闭';
        } else if (card.type === 'flashcard') {
          const scenesHtml = Array.isArray(card.scenes) && card.scenes.length > 0
            ? `<div class="scene-pills">${card.scenes.map((s) => `<span class="scene-pill">${escapeHtml(s)}</span>`).join('')}</div>`
            : '';
          elModalBody.innerHTML = `
            <div class="flash-stage ${isFlipped ? 'flipped' : ''}" id="flashStage" tabindex="0">
              ${!isFlipped ? `
                <div class="flash-term">${escapeHtml(card.title)}</div>
                <div class="flash-hint">先在心里回忆 2 秒，点击卡片或按空格翻面</div>
              ` : `
                <span class="type-pill" style="background: var(--green-soft); color: var(--green);">人话解释</span>
                <p class="flash-answer">${escapeHtml(card.plain || '')}</p>
                ${scenesHtml}
                <div class="flash-hint">点击翻回正面</div>
              `}
            </div>
            ${renderCollapsedDetails(card)}
          `;
          document.getElementById('flashStage').onclick = () => { isFlipped = !isFlipped; renderModal(); };
          elKbdHint.textContent = '快捷键：空格键翻面 · ← / → 切换上下张 · Esc 关闭';
        } else {
          const promptText = `请用不超过 4 步极简分步图解 + 零黑话大白话，结合我平时做的社交 App 场景给我讲透：【${card.title}】`;
          elModalBody.innerHTML = `
            <div class="todo-box">
              <p class="todo-context">${escapeHtml(card.context || card.hook || '等待下次复盘时找 Agent 讲透。')}</p>
              <button class="btn-violet" id="copyAskBtn">📋 复制大白话提问给 Agent</button>
            </div>
          `;
          document.getElementById('copyAskBtn').onclick = () => copyText(promptText, '✓ 已复制！直接粘贴到 Agent 对话即可');
          elKbdHint.textContent = '快捷键：← / → 切换上下张 · Esc 关闭';
        }

        // Mastery Progression Controls (Local Server Only)
        if (canEdit) {
          elMasteryGroup.innerHTML = `
            <button class="btn-state ${st === 'to-learn' ? 'active-todo' : ''}" id="stToLearn">未学习</button>
            <button class="btn-state ${st === 'reviewing' ? 'active-fuzzy' : ''}" id="stReviewing">待复盘</button>
            <button class="btn-state ${st === 'mastered' ? 'active-done' : ''}" id="stMastered">✓ 已掌握</button>
          `;
          document.getElementById('stToLearn').onclick = () => quickSaveStatus(card, 'to-learn');
          document.getElementById('stReviewing').onclick = () => quickSaveStatus(card, 'reviewing');
          document.getElementById('stMastered').onclick = () => quickSaveStatus(card, 'mastered');
        } else {
          elMasteryGroup.innerHTML = `<span class="status-dot st-${escapeHtml(st)}">${STATUS_LABEL[st] || st}</span>`;
        }

        elPrevCard.style.visibility = sessionIds.length > 1 ? 'visible' : 'hidden';
        elNextCard.style.visibility = sessionIds.length > 1 ? 'visible' : 'hidden';
        elPrevCard.disabled = sessionIdx === 0;
        elNextCard.disabled = sessionIdx === sessionIds.length - 1;
      }

      async function quickSaveStatus(card, nextStatus) {
        if (!canEdit || card.status === nextStatus) return;
        const nextBucket = nextStatus === 'to-learn' ? 'to-learn' : (card.type === 'contrast' ? 'blindspots' : 'reinforce');
        try {
          await saveCardApi({ ...card, status: nextStatus, bucket: nextBucket });
          renderModal();
          showToast(`已切换为「${STATUS_LABEL[nextStatus]}」并自动保存 ✓`);
        } catch (err) {
          showToast(err.message || '保存失败');
        }
      }

      /* ---------- Auto-Save Card Editor (Local Server Only) ---------- */
      function setSavePill(state, text) {
        elSavePill.className = `save-pill ${state}`;
        elSavePill.textContent = text;
      }

      function createEmptyDraft(type = 'contrast') {
        return {
          id: '', title: '', bucket: type === 'contrast' ? 'blindspots' : type === 'todo' ? 'to-learn' : 'reinforce',
          type, status: type === 'todo' ? 'to-learn' : 'reviewing',
          project: '通用', tags: activeTag !== 'all' ? [activeTag] : ['前端渲染与交互'],
          source: '', date: new Date().toISOString().slice(0, 10), hook: '',
          wrong: '', right: '', rule: '', plain: '', scenes: [], context: '', summary: '', demo: '',
          nodes: [{ id: 'A', icon: '📱', label: '用户手机' }, { id: 'S', icon: '🏢', label: '我们后台' }],
          steps: [{ title: '第 1 步', actionsRaw: 'A->S', text: '' }],
          glossary: [], tips: [],
        };
      }

      function openEditor(existingCard) {
        if (!canEdit) return;
        closeModal();
        editorDraft = existingCard ? JSON.parse(JSON.stringify(existingCard)) : createEmptyDraft('contrast');
        if (!Array.isArray(editorDraft.tags)) editorDraft.tags = [];
        if (!Array.isArray(editorDraft.nodes) || editorDraft.nodes.length === 0) {
          editorDraft.nodes = [{ id: 'A', icon: '📱', label: '用户手机' }, { id: 'S', icon: '🏢', label: '我们后台' }];
        }
        if (!Array.isArray(editorDraft.steps) || editorDraft.steps.length === 0) {
          editorDraft.steps = [{ title: '第 1 步', actionsRaw: 'A->S', text: '' }];
        }
        elEditorHeading.textContent = editorDraft.id ? `编辑卡片 · ${editorDraft.id}` : '新建卡片';
        setSavePill('', editorDraft.id ? '修改停顿 0.5 秒自动保存' : '输入标题后自动保存');
        elEditorBackdrop.classList.add('open');
        elEditorBackdrop.setAttribute('aria-hidden', 'false');
        renderEditorForm();
      }

      async function closeEditor() {
        if (autoSaveTimer) {
          clearTimeout(autoSaveTimer);
          autoSaveTimer = null;
          await flushEditorSave();
        }
        elEditorBackdrop.classList.remove('open');
        elEditorBackdrop.setAttribute('aria-hidden', 'true');
        editorDraft = null;
      }

      function scheduleAutoSave(immediate = false) {
        if (!canEdit || !editorDraft) return;
        if (!String(editorDraft.title || '').trim()) {
          setSavePill('', '请先填写标题即可自动保存');
          return;
        }
        setSavePill('saving', '准备保存…');
        if (autoSaveTimer) clearTimeout(autoSaveTimer);
        if (immediate) { autoSaveTimer = null; flushEditorSave(); return; }
        autoSaveTimer = setTimeout(() => { autoSaveTimer = null; flushEditorSave(); }, 500);
      }

      async function flushEditorSave() {
        if (!canEdit || !editorDraft || !String(editorDraft.title || '').trim()) return;
        if (saveInFlight) { saveQueued = true; return; }
        saveInFlight = true;
        setSavePill('saving', '保存中…');
        try {
          const saved = await saveCardApi(editorDraft);
          if (saved && saved.id && !editorDraft.id) {
            editorDraft.id = saved.id;
            elEditorHeading.textContent = `编辑卡片 · ${saved.id}`;
          }
          setSavePill('saved', '已自动保存至 pm-kb.md ✓');
        } catch (err) {
          setSavePill('error', err.message || '保存失败');
        } finally {
          saveInFlight = false;
          if (saveQueued) { saveQueued = false; flushEditorSave(); }
        }
      }

      function bindCharCounter(inputEl, counterEl, limit) {
        const update = () => {
          const len = inputEl.value.trim().length;
          counterEl.textContent = `${len} / ${limit} 字`;
          counterEl.classList.toggle('over', len > limit);
        };
        update();
        inputEl.addEventListener('input', update);
      }

      function renderEditorForm() {
        if (!editorDraft) return;
        const d = editorDraft;

        let typeFieldsHtml = '';
        if (d.type === 'demo') {
          typeFieldsHtml = `
            <div class="field">
              <label class="field-label"><span>一句话大白话结论</span><span class="char-counter" id="cntSummary"></span></label>
              <textarea class="textarea" id="edSummary" placeholder="建议 ≤42 字">${escapeHtml(d.summary || '')}</textarea>
            </div>
            <div class="field">
              <label class="field-label"><span>💡 写需求红线</span></label>
              <input class="input" id="edRule" value="${escapeHtml(d.rule || '')}" placeholder="写 PRD 时必须补哪一句话？" />
            </div>
          `;
        } else if (d.type === 'contrast') {
          typeFieldsHtml = `
            <div class="form-row-2">
              <div class="field">
                <label class="field-label"><span>❌ 当时容易漏掉</span><span class="char-counter" id="cntWrong"></span></label>
                <textarea class="textarea" id="edWrong">${escapeHtml(d.wrong || '')}</textarea>
              </div>
              <div class="field">
                <label class="field-label"><span>✅ 正确补法</span><span class="char-counter" id="cntRight"></span></label>
                <textarea class="textarea" id="edRight">${escapeHtml(d.right || '')}</textarea>
              </div>
            </div>
            <div class="field">
              <label class="field-label"><span>💡 下次自检（可选）</span></label>
              <input class="input" id="edRule" value="${escapeHtml(d.rule || '')}" />
            </div>
          `;
        } else if (d.type === 'flashcard') {
          typeFieldsHtml = `
            <div class="field">
              <label class="field-label"><span>人话解释（翻面内容）</span><span class="char-counter" id="cntPlain"></span></label>
              <textarea class="textarea" id="edPlain">${escapeHtml(d.plain || '')}</textarea>
            </div>
            <div class="field">
              <label class="field-label"><span>常见业务场景（逗号隔开）</span></label>
              <input class="input" id="edScenes" value="${escapeHtml((d.scenes || []).join('，'))}" />
            </div>
          `;
        } else if (d.type === 'todo') {
          typeFieldsHtml = `
            <div class="field">
              <label class="field-label"><span>遇到背景 / 想弄懂的问题</span></label>
              <textarea class="textarea" id="edContext">${escapeHtml(d.context || '')}</textarea>
            </div>
          `;
        } else if (d.type === 'flow') {
          typeFieldsHtml = `
            <div class="field">
              <label class="field-label"><span>图解节点（2~4 个）</span><button type="button" class="btn-soft" id="addNodeBtn">+ 加节点</button></label>
              <div class="dyn-list">
                ${d.nodes.map((n, i) => `
                  <div class="dyn-row node-row">
                    <input class="input" data-node-field="id" data-idx="${i}" value="${escapeHtml(n.id)}" />
                    <input class="input" data-node-field="icon" data-idx="${i}" value="${escapeHtml(n.icon)}" />
                    <input class="input" data-node-field="label" data-idx="${i}" value="${escapeHtml(n.label)}" />
                    <button type="button" class="mini-del" data-del-node="${i}">×</button>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="field">
              <label class="field-label"><span>分步动作（每步建议 ≤22 字）</span><button type="button" class="btn-soft" id="addStepBtn">+ 加步骤</button></label>
              <div class="syntax-note">连线写法：<code>A->S</code> 单向 · <code>A<->R</code> 双向 · <code>S*</code> 高亮 · <code>S-x-R</code> 断开</div>
              <div class="dyn-list">
                ${d.steps.map((s, i) => `
                  <div class="dyn-row step-row">
                    <input class="input" data-step-field="title" data-idx="${i}" value="${escapeHtml(s.title)}" />
                    <input class="input" data-step-field="actionsRaw" data-idx="${i}" value="${escapeHtml(s.actionsRaw || '')}" />
                    <input class="input" data-step-field="text" data-idx="${i}" value="${escapeHtml(s.text)}" />
                    <button type="button" class="mini-del" data-del-step="${i}">×</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        const glossaryText = (d.glossary || []).map((g) => `${g.term} | ${g.plain}`).join('\n');
        const tipsText = (d.tips || []).join('\n');
        const editableTypes = d.type === 'demo' ? ['demo', 'contrast', 'flashcard', 'flow', 'todo'] : ['contrast', 'flashcard', 'flow', 'todo'];

        elEditorForm.innerHTML = `
          <div class="field">
            <label class="field-label"><span>卡片类型</span></label>
            <div class="type-picker">
              ${editableTypes.map((k) => `<button type="button" class="type-opt ${d.type === k ? 'active' : ''}" data-pick-type="${k}">${TYPE_META[k].icon} ${TYPE_META[k].label}</button>`).join('')}
            </div>
          </div>

          <div class="form-row-2">
            <div class="field">
              <label class="field-label"><span>标题 *</span></label>
              <input class="input" id="edTitle" value="${escapeHtml(d.title)}" placeholder="输入标题即自动保存" />
            </div>
            <div class="field">
              <label class="field-label"><span>学习状态</span></label>
              <select class="select" id="edStatus">
                <option value="to-learn" ${d.status === 'to-learn' ? 'selected' : ''}>未学习</option>
                <option value="reviewing" ${d.status === 'reviewing' ? 'selected' : ''}>待复盘</option>
                <option value="mastered" ${d.status === 'mastered' ? 'selected' : ''}>已掌握</option>
              </select>
            </div>
          </div>

          <div class="form-row-2">
            <div class="field">
              <label class="field-label"><span>一句话摘要（首页显示）</span><span class="char-counter" id="cntHook"></span></label>
              <input class="input" id="edHook" value="${escapeHtml(d.hook || '')}" placeholder="建议 ≤20 字" />
            </div>
            <div class="field">
              <label class="field-label"><span>主题标签（逗号隔开）</span></label>
              <input class="input" id="edTags" value="${escapeHtml((d.tags || []).join(', '))}" placeholder="前端渲染与交互, 音视频与房间" />
            </div>
          </div>

          ${typeFieldsHtml}

          <div class="form-row-2">
            <div class="field">
              <label class="field-label"><span>出处 / 来源（可选）</span></label>
              <input class="input" id="edSource" value="${escapeHtml(d.source || '')}" placeholder="如：Laka 评审 / 前端逻辑表" />
            </div>
            <div class="field">
              <label class="field-label"><span>所属项目</span></label>
              <input class="input" id="edProject" value="${escapeHtml(d.project || '通用')}" />
            </div>
          </div>

          <details>
            <summary>更多折叠项：开发黑话对照 / 避坑清单（可选）</summary>
            <div class="editor-grid" style="margin-top:12px;">
              <div class="field"><label class="field-label"><span>开发黑话对照（每行：术语 | 人话）</span></label><textarea class="textarea" id="edGlossary">${escapeHtml(glossaryText)}</textarea></div>
              <div class="field"><label class="field-label"><span>常漏避坑点（每行一条）</span></label><textarea class="textarea" id="edTips">${escapeHtml(tipsText)}</textarea></div>
            </div>
          </details>
        `;

        elEditorForm.querySelectorAll('[data-pick-type]').forEach((btn) => {
          btn.onclick = () => {
            editorDraft.type = btn.dataset.pickType;
            renderEditorForm();
            scheduleAutoSave(true);
          };
        });

        const bindInput = (id, key, transform) => {
          const el = document.getElementById(id);
          if (!el) return null;
          el.addEventListener('input', () => {
            editorDraft[key] = transform ? transform(el.value) : el.value;
            scheduleAutoSave(false);
          });
          el.addEventListener('blur', () => { if (autoSaveTimer) scheduleAutoSave(true); });
          return el;
        };

        bindInput('edTitle', 'title');
        document.getElementById('edStatus').onchange = (e) => {
          editorDraft.status = e.target.value;
          editorDraft.bucket = e.target.value === 'to-learn' ? 'to-learn' : (editorDraft.type === 'contrast' ? 'blindspots' : 'reinforce');
          scheduleAutoSave(true);
        };

        const elHook = bindInput('edHook', 'hook');
        if (elHook) bindCharCounter(elHook, document.getElementById('cntHook'), 20);
        bindInput('edTags', 'tags', (v) => v.split(/[,，、]/).map((s) => s.trim()).filter(Boolean));
        bindInput('edSource', 'source');
        bindInput('edProject', 'project');

        if (d.type === 'demo') {
          const es = bindInput('edSummary', 'summary');
          if (es) bindCharCounter(es, document.getElementById('cntSummary'), 42);
          bindInput('edRule', 'rule');
        } else if (d.type === 'contrast') {
          const ew = bindInput('edWrong', 'wrong');
          const er = bindInput('edRight', 'right');
          if (ew) bindCharCounter(ew, document.getElementById('cntWrong'), 32);
          if (er) bindCharCounter(er, document.getElementById('cntRight'), 32);
          bindInput('edRule', 'rule');
        } else if (d.type === 'flashcard') {
          const ep = bindInput('edPlain', 'plain');
          if (ep) bindCharCounter(ep, document.getElementById('cntPlain'), 45);
          bindInput('edScenes', 'scenes', (v) => v.split(/[，,]/).map((s) => s.trim()).filter(Boolean));
        } else if (d.type === 'todo') {
          bindInput('edContext', 'context');
        } else if (d.type === 'flow') {
          elEditorForm.querySelectorAll('[data-node-field]').forEach((inp) => {
            inp.oninput = () => { editorDraft.nodes[Number(inp.dataset.idx)][inp.dataset.nodeField] = inp.value; scheduleAutoSave(false); };
          });
          elEditorForm.querySelectorAll('[data-del-node]').forEach((btn) => {
            btn.onclick = () => {
              if (editorDraft.nodes.length <= 2) return showToast('至少保留 2 个节点');
              editorDraft.nodes.splice(Number(btn.dataset.delNode), 1);
              renderEditorForm(); scheduleAutoSave(true);
            };
          });
          document.getElementById('addNodeBtn').onclick = () => {
            if (editorDraft.nodes.length >= 4) return showToast('最多支持 4 个节点');
            const letters = ['A', 'B', 'S', 'R'];
            const nextId = letters.find((l) => !editorDraft.nodes.some((n) => n.id === l)) || `N${editorDraft.nodes.length + 1}`;
            editorDraft.nodes.push({ id: nextId, icon: '🔹', label: '新节点' });
            renderEditorForm(); scheduleAutoSave(true);
          };
          elEditorForm.querySelectorAll('[data-step-field]').forEach((inp) => {
            inp.oninput = () => { editorDraft.steps[Number(inp.dataset.idx)][inp.dataset.stepField] = inp.value; scheduleAutoSave(false); };
          });
          elEditorForm.querySelectorAll('[data-del-step]').forEach((btn) => {
            btn.onclick = () => {
              if (editorDraft.steps.length <= 1) return showToast('至少保留 1 个步骤');
              editorDraft.steps.splice(Number(btn.dataset.delStep), 1);
              renderEditorForm(); scheduleAutoSave(true);
            };
          });
          document.getElementById('addStepBtn').onclick = () => {
            editorDraft.steps.push({ title: `第 ${editorDraft.steps.length + 1} 步`, actionsRaw: 'A->S', text: '' });
            renderEditorForm(); scheduleAutoSave(true);
          };
        }

        bindInput('edGlossary', 'glossary', (v) =>
          v.split('\n').map((l) => l.split('|').map((s) => s.trim())).filter((p) => p.length >= 2 && p[0] && p[1]).map(([term, plain]) => ({ term, plain }))
        );
        bindInput('edTips', 'tips', (v) => v.split('\n').map((s) => s.trim()).filter(Boolean));
      }

      /* ---------- Global Events ---------- */
      elSearch.addEventListener('input', (e) => { query = e.target.value; renderGrid(); });
      elNewCardBtn.addEventListener('click', () => openEditor(null));
      elStartReview.addEventListener('click', () => {
        const list = filteredCards().filter((c) => c.status !== 'mastered');
        const target = list.length > 0 ? list : cards.filter((c) => c.status !== 'mastered');
        if (target.length > 0) openModal(target.map((c) => c.id), 0);
      });

      document.getElementById('closeModalBtn').onclick = closeModal;
      elBackdrop.onclick = (e) => { if (e.target === elBackdrop) closeModal(); };
      elEditCardBtn.onclick = () => { const c = getCardById(sessionIds[sessionIdx]); if (c) openEditor(c); };
      elDeleteCardBtn.onclick = async () => {
        const c = getCardById(sessionIds[sessionIdx]);
        if (!c || !canEdit) return;
        if (!window.confirm(`确定删除卡片「${c.title}」吗？`)) return;
        try { await deleteCardApi(c.id); closeModal(); showToast('已删除并自动同步 ✓'); }
        catch (err) { showToast(err.message || '删除失败'); }
      };

      document.getElementById('doneEditorBtn').onclick = closeEditor;
      elEditorBackdrop.onclick = (e) => { if (e.target === elEditorBackdrop) closeEditor(); };

      elPrevCard.onclick = () => { if (sessionIdx > 0) { sessionIdx -= 1; flowStepIdx = 0; isFlipped = false; renderModal(); } };
      elNextCard.onclick = () => { if (sessionIdx < sessionIds.length - 1) { sessionIdx += 1; flowStepIdx = 0; isFlipped = false; renderModal(); } };

      document.addEventListener('keydown', (e) => {
        if (elEditorBackdrop.classList.contains('open')) { if (e.key === 'Escape') closeEditor(); return; }
        if (!elBackdrop.classList.contains('open')) return;
        const card = getCardById(sessionIds[sessionIdx]);
        if (!card) return;
        if (e.key === 'Escape') { closeModal(); return; }
        if (card.type === 'flashcard' && e.code === 'Space') { e.preventDefault(); isFlipped = !isFlipped; renderModal(); return; }
        if (e.key === 'ArrowRight') {
          if (card.type === 'flow' && flowStepIdx < (card.steps || []).length - 1) { flowStepIdx += 1; renderModal(); }
          else if (sessionIdx < sessionIds.length - 1) { sessionIdx += 1; flowStepIdx = 0; isFlipped = false; renderModal(); }
        }
        if (e.key === 'ArrowLeft') {
          if (card.type === 'flow' && flowStepIdx > 0) { flowStepIdx -= 1; renderModal(); }
          else if (sessionIdx > 0) { sessionIdx -= 1; flowStepIdx = 0; isFlipped = false; renderModal(); }
        }
      });

      function applyHashLink() {
        const hash = (window.location.hash || '').replace(/^#/, '');
        if (!hash) return;
        const params = new URLSearchParams(hash);
        const cardId = params.get('card');
        if (!cardId) return;
        const idx = cards.findIndex((c) => c.id === cardId);
        if (idx === -1) return;
        openModal(cards.map((c) => c.id), idx);
        if (params.has('step')) flowStepIdx = Math.max(0, Number(params.get('step')) || 0);
        if (params.get('flip') === '1') isFlipped = true;
        renderModal();
      }

      renderAll();
      fetchLocalKb().then(() => applyHashLink());
      if (!IS_LOCAL_HOST) applyHashLink();
    })();
  </script>
</body>
</html>
