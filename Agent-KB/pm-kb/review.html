<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM 复盘卡片 · 个人可视化知识库</title>
  <style>
    :root {
      --bg: #fbf9f5;
      --surface: #ffffff;
      --surface-soft: #f6f2eb;
      --border: #e9e2d6;
      --border-strong: #d8cfc0;
      --ink: #1c1917;
      --ink-2: #57534e;
      --ink-3: #8c857b;

      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --blue-border: #bfdbfe;

      --green: #15803d;
      --green-soft: #f0fdf4;
      --green-border: #bbf7d0;

      --red: #dc2626;
      --red-soft: #fef2f2;
      --red-border: #fecaca;

      --amber: #b45309;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;

      --violet: #6d28d9;
      --violet-soft: #f5f3ff;
      --violet-border: #ddd6fe;

      --teal: #0f766e;
      --teal-soft: #f0fdfa;
      --teal-border: #99f6e4;

      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-sm: 0 2px 10px rgba(28, 25, 23, 0.04);
      --shadow-md: 0 12px 36px rgba(28, 25, 23, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 1020px;
      margin: 0 auto;
      padding: 34px 24px 72px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .stats {
      margin-top: 6px;
      font-size: 14px;
      color: var(--ink-3);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stats b { color: var(--ink-2); font-weight: 600; }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      appearance: none;
      border: none;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary:hover { transform: translateY(-1px); opacity: 0.92; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-accent {
      appearance: none;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 17px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-accent:hover { opacity: 0.92; }

    .btn-soft {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-soft:hover { background: var(--surface-soft); }
    .btn-soft:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-danger-soft {
      appearance: none;
      border: 1px solid var(--red-border);
      background: var(--red-soft);
      color: var(--red);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Mode & Cloud Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--ink-2);
    }

    .status-bar.readonly-bar { background: var(--surface-soft); }
    .status-left, .status-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .dot-ind {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green); display: inline-block;
    }
    .dot-ind.syncing { background: var(--blue); }
    .dot-ind.warn { background: #d97706; }
    .dot-ind.err { background: var(--red); }

    .url-link { color: var(--blue); text-decoration: none; font-weight: 500; }
    .url-link:hover { text-decoration: underline; }

    /* Dual-Row Filter Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }

    .tab {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-2);
      font-size: 14px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab:hover { background: var(--surface-soft); }
    .tab.active {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
      font-weight: 650;
    }

    .tab .count { margin-left: 4px; font-size: 12px; color: var(--ink-3); }

    .search {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      color: var(--ink);
      width: 230px;
      outline: none;
    }

    .search:focus { border-color: var(--border-strong); }

    /* Tag Filter Row */
    .tag-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .tag-bar-label {
      font-size: 12.5px;
      color: var(--ink-3);
      margin-right: 2px;
    }

    .tag-chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .tag-chip:hover { border-color: var(--border-strong); background: var(--surface-soft); }

    .tag-chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
      font-weight: 600;
    }

    .tag-chip .count { margin-left: 4px; opacity: 0.65; font-size: 11.5px; }

    /* Card Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      box-shadow: 0 8px 24px rgba(28, 25, 23, 0.07);
    }

    .card.mastered { opacity: 0.7; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .type-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .type-demo { background: var(--teal-soft); color: var(--teal); }
    .type-flow { background: var(--blue-soft); color: var(--blue); }
    .type-contrast { background: var(--red-soft); color: var(--red); }
    .type-flashcard { background: var(--amber-soft); color: var(--amber); }
    .type-todo { background: var(--violet-soft); color: var(--violet); }

    .status-dot {
      font-size: 12px;
      color: var(--ink-3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot::before {
      content: "";
      width: 7px; height: 7px; border-radius: 50%;
      background: #d97706;
    }

    .status-dot.st-mastered { color: var(--green); }
    .status-dot.st-mastered::before { background: var(--green); }
    .status-dot.st-to-learn { color: var(--violet); }
    .status-dot.st-to-learn::before { background: var(--violet); }

    .card-title { margin: 0; font-size: 17.5px; font-weight: 650; line-height: 1.4; color: var(--ink); }
    .card-hook { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.55; }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .mini-tag {
      font-size: 11.5px;
      color: var(--ink-3);
      background: var(--surface-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 20px;
      color: var(--ink-3);
      font-size: 15px;
    }

    /* Backdrop & Modals */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.44);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .backdrop.open { display: flex; }

    .modal {
      width: min(760px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 26px;
      padding: 24px 30px 22px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-meta, .modal-head-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .meta-tag { font-size: 12px; color: var(--ink-3); background: var(--surface-soft); padding: 4px 10px; border-radius: 999px; }

    .btn-close {
      appearance: none; border: none; background: var(--surface-soft); color: var(--ink-2);
      width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-close:hover { background: var(--border); color: var(--ink); }

    .modal-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.35; }
    .modal-source { margin: -10px 0 0; font-size: 12.5px; color: var(--ink-3); }

    /* Interactive Demo Playground Shell */
    .demo-stage {
      background: #f8f5ef;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .demo-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .seg-btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: #fff;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .seg-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .seg-btn.active-red { background: var(--red); color: #fff; border-color: var(--red); }
    .seg-btn.active-green { background: var(--green); color: #fff; border-color: var(--green); }
    .seg-btn.active-blue { background: var(--blue); color: #fff; border-color: var(--blue); }

    .demo-summary {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      line-height: 1.55;
    }

    /* Demo 1: RTL Mirror */
    .rtl-phone {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    .rtl-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .rtl-user { display: flex; align-items: center; gap: 8px; }
    .rtl-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f97316);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }

    .exempt-box {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      direction: ltr;
      unicode-bidi: isolate;
      transition: all 0.2s ease;
    }

    .exempt-vip { background: #fef3c7; color: #92400e; border: 1.5px solid #f59e0b; }
    .exempt-timer { background: #eff6ff; color: #1d4ed8; border: 1.5px solid #60a5fa; font-variant-numeric: tabular-nums; }
    .rtl-phone.is-rtl .exempt-box { box-shadow: 0 0 0 2.5px rgba(21, 128, 61, 0.28); border-color: var(--green); }

    .rtl-video {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      direction: ltr;
    }

    .rtl-phone.is-rtl .rtl-video { outline: 2.5px solid var(--green); }

    .rtl-chat {
      background: var(--surface-soft);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13.5px;
      color: var(--ink-2);
    }

    .exempt-badge {
      font-size: 11px;
      background: var(--green);
      color: #fff;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Demo 2: Touch Pass-Through */
    .room-mock {
      position: relative;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border-radius: 18px;
      padding: 16px 20px;
      min-height: 228px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .room-seats {
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 13px;
      opacity: 0.9;
    }

    .seat-dot {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .seat-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.16);
      border: 1.5px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center; font-size: 19px;
    }

    .room-bottom-btns {
      display: flex;
      justify-content: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .room-btn {
      border: 1.5px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
    }

    .room-btn:hover { background: rgba(255,255,255,0.28); }

    .gift-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: radial-gradient(circle at 50% 44%, rgba(251, 191, 36, 0.34), rgba(190, 24, 93, 0.22));
      border: 2px dashed rgba(253, 224, 71, 0.75);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: not-allowed;
      transition: background 0.15s ease;
    }

    .gift-overlay.passthrough {
      pointer-events: none;
      border-color: rgba(74, 222, 128, 0.7);
      background: radial-gradient(circle at 50% 44%, rgba(251, 191, 36, 0.2), rgba(21, 128, 61, 0.12));
    }

    .gift-overlay.blocked-flash {
      background: rgba(220, 38, 38, 0.45);
    }

    .demo-feedback {
      text-align: center;
      font-size: 13.5px;
      font-weight: 650;
      min-height: 22px;
    }

    /* Demo 3: Avatar 6 Layers */
    .avatar-lab {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 18px;
      align-items: center;
    }

    @media (max-width: 600px) { .avatar-lab { grid-template-columns: 1fr; } }

    .avatar-preview-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-safe-box {
      width: 118px; height: 118px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-safe-label {
      position: absolute;
      bottom: -22px;
      font-size: 11px;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .av-wave {
      position: absolute;
      width: 108px; height: 108px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.22);
    }

    .av-base {
      position: relative;
      z-index: 2;
      width: 82px; height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fed7aa, #fb923c);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      overflow: hidden;
    }

    .av-mask {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.62);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .av-frame {
      position: absolute;
      z-index: 4;
      width: 107px; height: 107px; /* 1.3x of 82px */
      border-radius: 50%;
      border: 5px solid #f59e0b;
      box-shadow: 0 0 0 2px #fef08a inset, 0 0 12px rgba(245, 158, 11, 0.45);
      pointer-events: none;
    }

    .av-badge-tl {
      position: absolute;
      top: 8px; left: 4px;
      z-index: 5;
      background: #7c3aed;
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .av-badge-br {
      position: absolute;
      bottom: 12px; right: 10px;
      z-index: 6;
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .layer-toggles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .layer-chk {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    /* Demo 4: Chat Scroll Anti-Jump */
    .chat-box-wrap {
      position: relative;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    .chat-scroll-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 164px;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .chat-line {
      font-size: 13.5px;
      background: var(--surface-soft);
      padding: 6px 10px;
      border-radius: 10px;
      color: var(--ink-2);
    }

    .chat-line b { color: var(--ink); }

    .unread-bubble {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      border: none;
      background: var(--blue);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Demo 5: Floor & Tabular Nums */
    .num-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .num-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: center;
    }

    .num-big {
      font-size: 26px;
      font-weight: 750;
      margin: 4px 0;
    }

    /* Demo 6: Nine Patch & CenterCrop */
    .np-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .np-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Demo 7: HitSlop */
    .hit-stage {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      height: 144px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .hit-card-mock {
      width: 240px;
      height: 92px;
      background: var(--surface-soft);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13.5px;
      color: var(--ink-3);
      cursor: pointer;
    }

    .hit-target {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 10px;
    }

    .hit-visual-x {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Demo 8: Exposure Track */
    .exp-feed {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      height: 196px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 460px;
      width: 100%;
      margin: 0 auto;
    }

    .exp-item {
      height: 120px;
      flex-shrink: 0;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface-soft);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .exp-item.exposed {
      background: var(--green-soft);
      border-color: var(--green-border);
    }

    .exp-item.watching {
      background: var(--blue-soft);
      border-color: var(--blue-border);
    }

    /* Demo 9 & 10: Dual Phone Simulator */
    .dual-phones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 600px) {
      .dual-phones, .num-grid, .np-row { grid-template-columns: 1fr; }
    }

    .mini-phone {
      background: #fff;
      border: 1.5px solid var(--border-strong);
      border-radius: 18px;
      padding: 12px 14px;
      min-height: 158px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .mini-phone-head {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-2);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .video-call-canvas {
      flex: 1;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 14px;
      position: relative;
      transition: all 0.2s ease;
    }

    .video-call-canvas.blackout {
      background: #09090b;
    }

    .video-call-canvas.blurred .vc-face {
      filter: blur(11px);
    }

    .vc-overlay-alert {
      position: absolute;
      inset: 8px;
      background: rgba(15, 23, 42, 0.78);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.45;
    }

    /* Template A: Flow Interactive Stage */
    .flow-stage {
      background: #f8f5ef;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .flow-svg { width: 100%; max-height: 215px; height: auto; display: block; user-select: none; }
    .edge-flow { stroke-dasharray: 8 6; animation: dashMove 1.1s linear infinite; }
    @keyframes dashMove { to { stroke-dashoffset: -28; } }

    .step-caption-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 18px;
      text-align: center;
    }

    .step-badge {
      display: inline-block; font-size: 12px; font-weight: 600;
      color: var(--blue); background: var(--blue-soft);
      padding: 3px 10px; border-radius: 999px; margin-bottom: 6px;
    }

    .step-sentence { margin: 0; font-size: 18.5px; font-weight: 650; color: var(--ink); line-height: 1.45; }

    .step-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .step-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; flex: 1; }
    .step-pill {
      appearance: none; border: 1px solid var(--border); background: #fff; color: var(--ink-2);
      font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    }
    .step-pill.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
    .step-arrow-btn {
      appearance: none; border: 1px solid var(--border-strong); background: #fff; color: var(--ink);
      font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    }
    .step-arrow-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Template B: Contrast Card */
    .contrast-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .contrast-grid { grid-template-columns: 1fr; } .modal { padding: 20px 18px; } }
    .contrast-box { border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .contrast-wrong { background: var(--red-soft); border: 1px solid var(--red-border); }
    .contrast-right { background: var(--green-soft); border: 1px solid var(--green-border); }
    .contrast-label { font-size: 13px; font-weight: 700; }
    .contrast-wrong .contrast-label { color: var(--red); }
    .contrast-right .contrast-label { color: var(--green); }
    .contrast-text { margin: 0; font-size: 16.5px; font-weight: 600; line-height: 1.6; color: var(--ink); }

    .rule-box {
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 14.5px;
      color: #78350f;
      font-weight: 500;
    }

    /* Template C: Minimal Flashcard */
    .flash-stage {
      min-height: 220px; border-radius: 20px; border: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #faf7f0 100%);
      padding: 32px 26px; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 16px; user-select: none;
    }
    .flash-stage.flipped { background: linear-gradient(180deg, #f6fdf8 0%, #ffffff 100%); border-color: var(--green-border); }
    .flash-term { font-size: 32px; font-weight: 750; letter-spacing: -0.02em; color: var(--ink); }
    .flash-hint { font-size: 13px; color: var(--ink-3); background: var(--surface-soft); padding: 6px 14px; border-radius: 999px; }
    .flash-answer { margin: 0; font-size: 20px; font-weight: 650; line-height: 1.55; color: var(--ink); max-width: 520px; }
    .scene-pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .scene-pill { font-size: 13px; font-weight: 500; color: var(--green); background: var(--green-soft); border: 1px solid var(--green-border); padding: 5px 12px; border-radius: 999px; }

    /* Template D: Todo Card */
    .todo-box { background: var(--violet-soft); border: 1px solid var(--violet-border); border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 18px; }
    .todo-context { margin: 0; font-size: 16px; color: var(--ink-2); line-height: 1.7; }
    .btn-violet { align-self: flex-start; appearance: none; border: none; background: var(--violet); color: #fff; font-size: 14px; font-weight: 600; padding: 11px 20px; border-radius: 999px; cursor: pointer; }

    /* Collapsed Details */
    .fold-group { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
    details { background: var(--surface-soft); border-radius: 12px; padding: 9px 15px; }
    summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 6px; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "▸"; display: inline-block; transition: transform 0.15s ease; color: var(--ink-3); }
    details[open] summary::before { transform: rotate(90deg); }
    .glossary-list { margin-top: 10px; display: grid; gap: 7px; }
    .glossary-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .glossary-term { font-weight: 700; color: var(--ink); min-width: 96px; }
    .glossary-plain { color: var(--ink-2); flex: 1; }
    .tips-list { margin: 10px 0 2px; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 6px; }

    /* Modal Footer */
    .modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 14px; }
    .mastery-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn-state { appearance: none; border: 1px solid var(--border-strong); background: #fff; color: var(--ink-2); font-size: 13.5px; font-weight: 600; padding: 8px 15px; border-radius: 999px; cursor: pointer; }
    .btn-state:hover { background: var(--surface-soft); }
    .btn-state.active-todo { background: var(--violet-soft); border-color: var(--violet-border); color: var(--violet); }
    .btn-state.active-fuzzy { background: var(--amber-soft); border-color: var(--amber-border); color: var(--amber); }
    .btn-state.active-done { background: var(--green); border-color: var(--green); color: #fff; }
    .kbd-hint { text-align: center; font-size: 12px; color: var(--ink-3); margin-top: -6px; }

    /* Editor Form */
    .save-pill { font-size: 12.5px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--surface-soft); color: var(--ink-3); }
    .save-pill.saving { background: var(--blue-soft); color: var(--blue); }
    .save-pill.saved { background: var(--green-soft); color: var(--green); }
    .save-pill.error { background: var(--red-soft); color: var(--red); }

    .editor-grid { display: flex; flex-direction: column; gap: 13px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .form-row-2 { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field-label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .char-counter { font-size: 12px; font-weight: 500; color: var(--ink-3); }
    .char-counter.over { color: var(--amber); font-weight: 700; }

    .input, .textarea, .select {
      width: 100%; border: 1px solid var(--border); background: var(--bg);
      border-radius: 12px; padding: 9px 13px; font-size: 14px; font-family: inherit;
      color: var(--ink); outline: none;
    }
    .input:focus, .textarea:focus, .select:focus { border-color: var(--blue); background: #fff; }
    .textarea { resize: vertical; min-height: 70px; line-height: 1.55; }
    .type-picker { display: flex; gap: 7px; flex-wrap: wrap; }
    .type-opt { appearance: none; border: 1px solid var(--border); background: #fff; color: var(--ink-2); font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
    .type-opt.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .dyn-list { display: flex; flex-direction: column; gap: 8px; }
    .dyn-row { display: grid; gap: 8px; align-items: center; }
    .dyn-row.node-row { grid-template-columns: 52px 52px 1fr auto; }
    .dyn-row.step-row { grid-template-columns: 100px 124px 1fr auto; }
    .mini-del { appearance: none; border: none; background: var(--surface-soft); color: var(--ink-3); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 15px; }
    .mini-del:hover { background: var(--red-soft); color: var(--red); }
    .syntax-note { font-size: 12px; color: var(--ink-3); }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 500;
      padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
      transition: all 0.2s ease; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div>
        <h1>PM 复盘卡片</h1>
        <div class="stats" id="stats"></div>
      </div>
      <div class="header-actions">
        <button class="btn-accent" id="newCardBtn" style="display:none;">+ 新建卡片</button>
        <button class="btn-primary" id="startReviewBtn">▶ 5 分钟复盘</button>
      </div>
    </header>

    <div class="status-bar" id="statusBar"></div>

    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <input class="search" id="searchInput" type="search" placeholder="搜标题、关键词或标签…" />
    </div>

    <div class="tag-bar" id="tagBar"></div>

    <main class="grid" id="grid"></main>
  </div>

  <!-- Focus Review Modal -->
  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-head-right">
          <button class="btn-soft" id="editCardBtn" style="display:none;">编辑</button>
          <button class="btn-danger-soft" id="deleteCardBtn" style="display:none;">删除</button>
          <button class="btn-close" id="closeModalBtn" title="关闭 (Esc)">×</button>
        </div>
      </div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-source" id="modalSource" style="display:none;"></p>
      <div id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn-soft" id="prevCardBtn">← 上一张</button>
        <div class="mastery-group" id="masteryGroup"></div>
        <button class="btn-soft" id="nextCardBtn">下一张 →</button>
      </div>
      <div class="kbd-hint" id="kbdHint"></div>
    </div>
  </div>

  <!-- Auto-Save Editor Modal (Strictly Local Server Only) -->
  <div class="backdrop" id="editorBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-meta">
          <strong style="font-size:18px;" id="editorHeading">新建卡片</strong>
          <span class="save-pill" id="savePill">输入即自动保存</span>
        </div>
        <div class="modal-head-right">
          <button class="btn-soft" id="doneEditorBtn">完成</button>
        </div>
      </div>
      <div class="editor-grid" id="editorForm"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./kb-data.js"></script>
  <script>
    (function () {
      const host = window.location.hostname;
      const protocol = window.location.protocol;
      const IS_LOCAL_HOST = (protocol === 'http:' || protocol === 'https:') && (host === '127.0.0.1' || host === 'localhost');
      const IS_FILE_MODE = protocol === 'file:';

      let canEdit = false;
      let runtimeMode = IS_FILE_MODE ? 'file-offline' : (IS_LOCAL_HOST ? 'local-checking' : 'public-readonly');

      let cards = (window.PM_KB_DATA && Array.isArray(window.PM_KB_DATA.cards))
        ? window.PM_KB_DATA.cards
        : [];
      let deployInfo = { state: 'idle', publicUrl: '', lastSyncedAt: null, lastError: null };

      const VIEW_TABS = [
        { id: 'all', label: '全部' },
        { id: 'to-learn', label: '未学习' },
        { id: 'reviewing', label: '待复盘' },
        { id: 'mastered', label: '已掌握' },
        { id: 'blindspots', label: '错题本' },
      ];

      const PREFERRED_TAGS = ['前端渲染与交互', '音视频与房间', '出海与风控', '缓存与资损'];

      const TYPE_META = {
        demo: { label: '互动演示', icon: '🎮', cls: 'type-demo' },
        flow: { label: '分步图解', icon: '🧭', cls: 'type-flow' },
        contrast: { label: '错题对比', icon: '⚡', cls: 'type-contrast' },
        flashcard: { label: '概念闪卡', icon: '💡', cls: 'type-flashcard' },
        todo: { label: '待理解', icon: '🌱', cls: 'type-todo' },
      };

      const STATUS_LABEL = {
        'to-learn': '未学习',
        reviewing: '待复盘',
        mastered: '已掌握',
      };

      let activeView = 'all';
      let activeTag = 'all';
      let query = '';

      let sessionIds = [];
      let sessionIdx = 0;
      let flowStepIdx = 0;
      let isFlipped = false;

      let editorDraft = null;
      let autoSaveTimer = null;
      let saveInFlight = false;
      let saveQueued = false;
      let deployPollTimer = null;
      let demoTimers = [];

      const elStats = document.getElementById('stats');
      const elStatusBar = document.getElementById('statusBar');
      const elNewCardBtn = document.getElementById('newCardBtn');
      const elStartReview = document.getElementById('startReviewBtn');
      const elTabs = document.getElementById('tabs');
      const elTagBar = document.getElementById('tagBar');
      const elGrid = document.getElementById('grid');
      const elSearch = document.getElementById('searchInput');

      const elBackdrop = document.getElementById('backdrop');
      const elModalMeta = document.getElementById('modalMeta');
      const elModalTitle = document.getElementById('modalTitle');
      const elModalSource = document.getElementById('modalSource');
      const elModalBody = document.getElementById('modalBody');
      const elMasteryGroup = document.getElementById('masteryGroup');
      const elPrevCard = document.getElementById('prevCardBtn');
      const elNextCard = document.getElementById('nextCardBtn');
      const elKbdHint = document.getElementById('kbdHint');
      const elEditCardBtn = document.getElementById('editCardBtn');
      const elDeleteCardBtn = document.getElementById('deleteCardBtn');

      const elEditorBackdrop = document.getElementById('editorBackdrop');
      const elEditorHeading = document.getElementById('editorHeading');
      const elSavePill = document.getElementById('savePill');
      const elEditorForm = document.getElementById('editorForm');
      const elToast = document.getElementById('toast');

      function clearDemoTimers() {
        demoTimers.forEach((id) => clearInterval(id));
        demoTimers = [];
      }

      function showToast(msg) {
        elToast.textContent = msg;
        elToast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => elToast.classList.remove('show'), 2200);
      }

      function copyText(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast(successMsg),
            () => fallbackCopy(text, successMsg)
          );
        } else {
          fallbackCopy(text, successMsg);
        }
      }

      function fallbackCopy(text, successMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg);
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function getCardById(id) {
        return cards.find((c) => c.id === id);
      }

      function matchesView(c, viewId) {
        if (viewId === 'all') return true;
        if (viewId === 'blindspots') return c.bucket === 'blindspots' || c.type === 'contrast';
        return (c.status || 'reviewing') === viewId;
      }

      function filteredCards() {
        const q = query.trim().toLowerCase();
        return cards.filter((c) => {
          if (!matchesView(c, activeView)) return false;
          if (activeTag !== 'all' && !(Array.isArray(c.tags) && c.tags.includes(activeTag))) return false;
          if (q) {
            const hay = `${c.title} ${c.hook || ''} ${(c.tags || []).join(' ')} ${c.project || ''} ${c.source || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      function allTagNames() {
        const set = new Set(PREFERRED_TAGS);
        cards.forEach((c) => (c.tags || []).forEach((t) => set.add(t)));
        return Array.from(set).filter((t) => cards.some((c) => (c.tags || []).includes(t)));
      }

      /* ---------- Render Top Bars & Grid ---------- */
      function renderStatusBar() {
        elNewCardBtn.style.display = canEdit ? 'inline-flex' : 'none';

        if (runtimeMode === 'public-readonly') {
          elStatusBar.className = 'status-bar readonly-bar';
          elStatusBar.innerHTML = `
            <div class="status-left">
              <span class="dot-ind"></span>
              <span><strong>云端跨设备只读视图</strong> · 卡片和互动演示均可直接点玩，新增/改状态请在本机打开 <code>127.0.0.1:4321</code></span>
            </div>
          `;
          return;
        }

        if (runtimeMode === 'file-offline') {
          elStatusBar.className = 'status-bar readonly-bar';
          elStatusBar.innerHTML = `
            <div class="status-left">
              <span class="dot-ind warn"></span>
              <span>当前为离线只读方式 · 打开 <a class="url-link" href="http://127.0.0.1:4321">http://127.0.0.1:4321</a> 可自动保存并同步云端</span>
            </div>
          `;
          return;
        }

        elStatusBar.className = 'status-bar';
        let dotCls = 'dot-ind';
        let stateText = '本机自动保存已就绪（0.5s 写回 pm-kb.md）';
        if (deployInfo.state === 'scheduled') {
          dotCls = 'dot-ind syncing';
          stateText = '已写回本地 ✓ · 即将自动同步至跨设备云端…';
        } else if (deployInfo.state === 'deploying') {
          dotCls = 'dot-ind syncing';
          stateText = '正在同步至跨设备云端网页…';
        } else if (deployInfo.state === 'synced') {
          const t = deployInfo.lastSyncedAt ? new Date(deployInfo.lastSyncedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
          stateText = `本地与云端已同步 ✓${t ? `（${t}）` : ''}`;
        } else if (deployInfo.state === 'error') {
          dotCls = 'dot-ind err';
          stateText = `本地已保存，云端同步异常：${escapeHtml(deployInfo.lastError || '请重试')}`;
        }

        const pubUrl = deployInfo.publicUrl || '';
        const rightParts = [];
        if (pubUrl) {
          rightParts.push(`<a class="url-link" href="${escapeHtml(pubUrl)}" target="_blank" rel="noopener">📱 跨设备查看页 ↗</a>`);
          rightParts.push(`<button class="btn-soft" id="copyPublicUrlBtn">复制跨设备链接</button>`);

        rightParts.push(`<button class="btn-soft" id="deployNowBtn" ${deployInfo.state === 'deploying' ? 'disabled' : ''}>${deployInfo.state === 'deploying' ? '同步中…' : '立即同步云端'}</button>`);

        elStatusBar.innerHTML = `
          <div class="status-left"><span class="${dotCls}"></span><span>${stateText}</span></div>
          <div class="status-right">${rightParts.join('')}</div>

      function renderStats() {
        const total = cards.length;
        const toLearn = cards.filter((c) => c.status === 'to-learn').length;
        const reviewing = cards.filter((c) => c.status === 'reviewing').length;
        const mastered = cards.filter((c) => c.status === 'mastered').length;
        elStats.innerHTML = `
          <span>共 <b>${total}</b> 张</span>
          <span>未学习 <b>${toLearn}</b></span>
          <span>待复盘 <b>${reviewing}</b></span>

      function renderTabs() {
        elTabs.innerHTML = VIEW_TABS.map((t) => {
          const count = cards.filter((c) => matchesView(c, t.id)).length;
          return `
            <button class="tab ${activeView === t.id ? 'active' : ''}" data-view="${t.id}">
              ${t.label}<span class="count">${count}</span>
            </button>
          `;
        }).join('');

        elTabs.querySelectorAll('.tab').forEach((btn) => {
          btn.addEventListener('click', () => {
            activeView = btn.dataset.view;
            renderAll();
          });
        });
      }

      function renderTagBar() {
        const tags = allTagNames();
        const inView = cards.filter((c) => matchesView(c, activeView));
        const chips = [
          `<span class="tag-bar-label">主题标签</span>`,
          `<button class="tag-chip ${activeTag === 'all' ? 'active' : ''}" data-tag="all">全部标签<span class="count">${inView.length}</span></button>`,
          ...tags.map((t) => {
            const cnt = inView.filter((c) => (c.tags || []).includes(t)).length;
            return `<button class="tag-chip ${activeTag === t ? 'active' : ''}" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}<span class="count">${cnt}</span></button>`;
          }),
        ];
        elTagBar.innerHTML = chips.join('');
        elTagBar.querySelectorAll('.tag-chip').forEach((btn) => {
          btn.addEventListener('click', () => {
            activeTag = btn.dataset.tag;
            renderAll();
          });
        });
      }

      function renderGrid() {
        const list = filteredCards();
        if (list.length === 0) {
          elGrid.innerHTML = '<div class="empty">当前筛选下还没有卡片</div>';
          return;
        }

        elGrid.innerHTML = list.map((c) => {
          const tm = TYPE_META[c.type] || TYPE_META.flashcard;
          const st = c.status || 'reviewing';
          const tagHtml = (c.tags || []).length > 0
            ? `<div class="card-tags">${c.tags.map((t) => `<span class="mini-tag">#${escapeHtml(t)}</span>`).join('')}</div>`
            : '';
          return `
            <article class="card ${st === 'mastered' ? 'mastered' : ''}" data-id="${escapeHtml(c.id)}">
              <div class="card-top">
                <span class="type-pill ${tm.cls}">${tm.icon} ${tm.label}</span>
                <span class="status-dot st-${escapeHtml(st)}">${STATUS_LABEL[st] || st}</span>
              </div>
              <h3 class="card-title">${escapeHtml(c.title)}</h3>
              <p class="card-hook">${escapeHtml(c.hook || '')}</p>

            </article>
          `;
        }).join('');

        elGrid.querySelectorAll('.card').forEach((el) => {
          el.addEventListener('click', () => {
            const clickedId = el.dataset.id;
            const listNow = filteredCards();
            const idx = listNow.findIndex((c) => c.id === clickedId);
            openModal(listNow.map((c) => c.id), Math.max(0, idx));
          });
        });
      }

        renderStats();

        renderTabs();

        renderGrid();
      }

      /* ---------- Local Server API ---------- */
      async function fetchLocalKb() {
        if (!IS_LOCAL_HOST) return;
        try {
          const res = await fetch('/api/kb', { cache: 'no-store' });
          if (!res.ok) throw new Error('API unavailable');
          const data = await res.json();
          if (data && data.ok) {
            canEdit = true;
            runtimeMode = 'local-server';
            cards = data.cards || [];
            deployInfo = data.deploy || deployInfo;
            renderAll();
            if (deployInfo.state === 'scheduled' || deployInfo.state === 'deploying') startDeployPolling();
            else stopDeployPolling();
          }
        } catch {
          canEdit = false;
          runtimeMode = 'public-readonly';
          renderAll();
        }
      }

      function startDeployPolling() {
        if (deployPollTimer) return;
        deployPollTimer = setInterval(async () => {
          try {
            const res = await fetch('/api/kb', { cache: 'no-store' });
            const data = await res.json();
            if (data && data.ok && data.deploy) {
              deployInfo = data.deploy;
              renderStatusBar();
              if (deployInfo.state !== 'scheduled' && deployInfo.state !== 'deploying') stopDeployPolling();
            }
          } catch { stopDeployPolling(); }
        }, 2000);
      }

      function stopDeployPolling() {
        if (deployPollTimer) { clearInterval(deployPollTimer); deployPollTimer = null; }
      }

      async function saveCardApi(payload) {
        if (!canEdit) return null;
        const res = await fetch('/api/cards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || '保存失败');
        cards = data.cards || cards;
        if (data.deploy) deployInfo = data.deploy;
        startDeployPolling();
        renderAll();
        return data.card;
      }

      async function deleteCardApi(id) {
        if (!canEdit) return;
        const res = await fetch(`/api/cards/${encodeURIComponent(id)}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || '删除失败');
        cards = data.cards || cards;
        if (data.deploy) deployInfo = data.deploy;
        startDeployPolling();
        renderAll();
      }

      async function triggerDeployNow() {
        if (!canEdit) return;
        try {
          deployInfo.state = 'deploying';
          renderStatusBar();
          const res = await fetch('/api/deploy', { method: 'POST' });
          const data = await res.json();
          if (data && data.deploy) deployInfo = data.deploy;
          renderStatusBar();
          startDeployPolling();
        } catch { showToast('触发同步失败'); }
      }
