<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚礼照片上传</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .upload-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .upload-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-zone:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-zone.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.95em;
        }

        #fileInput {
            display: none;
        }

        .progress {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .photos-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .photos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .photos-header h2 {
            color: #333;
        }

        .photo-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .photo-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .photo-info {
            padding: 10px;
            background: #f8f9ff;
        }

        .photo-name {
            font-size: 0.9em;
            color: #333;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .photo-size {
            font-size: 0.8em;
            color: #999;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            line-height: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-card:hover .delete-btn {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .actions {
            margin-top: 30px;
            text-align: center;
        }

        .download-link {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-left: 15px;
            transition: all 0.3s ease;
        }

        .download-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .upload-zone {
                padding: 40px 15px;
            }

            .photos-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💒 婚礼照片上传</h1>
            <p>上传高清原图，让宾客下载美好回忆</p>
        </div>

        <div class="upload-area">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📸</div>
                <div class="upload-text">点击选择或拖拽图片到此处</div>
                <div class="upload-hint">支持 JPG、PNG、GIF、WebP 等格式，保留原图质量</div>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>

            <div class="progress" id="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
            </div>
        </div>

        <div class="photos-section">
            <div class="photos-header">
                <h2>已上传照片</h2>
                <span class="photo-count" id="photoCount">0 张</span>
            </div>
            <div class="photos-grid" id="photosGrid">
                <div class="loading" style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666;">加载中...</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn" id="refreshBtn">🔄 刷新列表</button>
            <a href="download.html" class="download-link">📱 访问下载页面</a>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const photosGrid = document.getElementById('photosGrid');
        const photoCount = document.getElementById('photoCount');
        const refreshBtn = document.getElementById('refreshBtn');

        // 点击上传区域
        uploadZone.addEventListener('click', () => fileInput.click());

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFiles(e.target.files);
            }
        });

        // 拖拽事件
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');

            if (e.dataTransfer.files.length > 0) {
                uploadFiles(e.dataTransfer.files);
            }
        });

        // 上传文件
        async function uploadFiles(files) {
            progress.style.display = 'block';
            const totalFiles = files.length;
            let uploadedCount = 0;

            for (const file of files) {
                const formData = new FormData();
                formData.append('photo', file);

                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        uploadedCount++;
                        const percent = Math.round((uploadedCount / totalFiles) * 100);
                        progressFill.style.width = percent + '%';
                        progressFill.textContent = percent + '%';
                    } else {
                        alert(`上传失败: ${result.error}`);
                    }
                } catch (error) {
                    console.error('上传错误:', error);
                    alert('上传失败，请检查网络连接');
                }
            }

            // 重置
            setTimeout(() => {
                progress.style.display = 'none';
                progressFill.style.width = '0%';
                fileInput.value = '';
                loadPhotos();
            }, 1000);
        }

        // 加载照片列表
        async function loadPhotos() {
            try {
                const response = await fetch('/api/photos');
                const data = await response.json();

                if (data.success) {
                    photoCount.textContent = `${data.photos.length} 张`;

                    if (data.photos.length === 0) {
                        photosGrid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1;">
                                <div class="empty-icon">📭</div>
                                <p>还没有上传任何照片</p>
                            </div>
                        `;
                        return;
                    }

                    photosGrid.innerHTML = data.photos.map(photo => `
                        <div class="photo-card">
                            <img src="${photo.url}" alt="${photo.filename}" loading="lazy">
                            <div class="photo-info">
                                <div class="photo-name" title="${photo.filename}">${photo.filename}</div>
                                <div class="photo-size">${formatSize(photo.size)}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('加载照片失败:', error);
                photosGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">⚠️</div>
                        <p>加载失败，请刷新页面重试</p>
                    </div>
                `;
            }
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // 刷新按钮
        refreshBtn.addEventListener('click', loadPhotos);

        // 初始加载
        loadPhotos();
    </script>
</body>
</html>
