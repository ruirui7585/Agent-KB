<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚礼照片下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .qr-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        .qr-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .qr-code {
            display: inline-block;
            padding: 20px;
            background: white;
            border: 2px solid #f5576c;
            border-radius: 10px;
        }

        .qr-hint {
            margin-top: 15px;
            color: #666;
            font-size: 0.95em;
        }

        .photos-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .toolbar h2 {
            color: #333;
        }

        .photo-count {
            background: #f5576c;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }

        .btn-secondary:hover {
            background: #fff5f6;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .photo-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            background: white;
        }

        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .photo-thumbnail {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            cursor: pointer;
        }

        .photo-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .photo-card:hover .photo-thumbnail img {
            transform: scale(1.05);
        }

        .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        .view-btn {
            background: white;
            color: #333;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }

        .photo-info {
            padding: 15px;
        }

        .photo-name {
            font-size: 0.95em;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .photo-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .photo-size {
            font-size: 0.85em;
            color: #999;
        }

        .download-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: white;
            color: #333;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            line-height: 40px;
        }

        .modal-download {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #f5576c;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .photos-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }

            .photo-thumbnail {
                height: 200px;
            }

            .toolbar {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💒 婚礼照片下载</h1>
            <p>下载高清原图，珍藏美好回忆</p>
        </div>

        <div class="qr-section">
            <h2>📱 分享给其他宾客</h2>
            <div class="qr-code" id="qrcode"></div>
            <div class="qr-hint">扫描二维码即可访问下载页面</div>
        </div>

        <div class="photos-section">
            <div class="toolbar">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <h2>照片列表</h2>
                    <span class="photo-count" id="photoCount">0 张</span>
                </div>
                <div>
                    <button class="btn btn-secondary" id="refreshBtn">🔄 刷新</button>
                </div>
            </div>
            <div class="photos-grid" id="photosGrid">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <img class="modal-image" id="modalImage" src="" alt="">
            <button class="modal-download" id="modalDownload">下载原图</button>
        </div>
    </div>

    <!-- QRCode.js 库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <script>
        const photosGrid = document.getElementById('photosGrid');
        const photoCount = document.getElementById('photoCount');
        const refreshBtn = document.getElementById('refreshBtn');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const modalDownload = document.getElementById('modalDownload');
        const qrcodeDiv = document.getElementById('qrcode');

        // 生成二维码
        function generateQRCode() {
            const url = window.location.href;
            QRCode.toCanvas(document.createElement('canvas'), url, {
                width: 200,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            }, function(error, canvas) {
                if (error) {
                    console.error(error);
                    return;
                }
                qrcodeDiv.innerHTML = '';
                qrcodeDiv.appendChild(canvas);
            });
        }

        // 加载照片列表
        async function loadPhotos() {
            try {
                const response = await fetch('/api/photos');
                const data = await response.json();

                if (data.success) {
                    photoCount.textContent = `${data.photos.length} 张`;

                    if (data.photos.length === 0) {
                        photosGrid.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1;">
                                <div class="empty-icon">📭</div>
                                <p>还没有照片可下载</p>
                            </div>
                        `;
                        return;
                    }

                    photosGrid.innerHTML = data.photos.map(photo => `
                        <div class="photo-card">
                            <div class="photo-thumbnail" onclick="openModal('${photo.filename}')">
                                <img src="${photo.url}" alt="${photo.filename}" loading="lazy">
                                <div class="photo-overlay">
                                    <button class="view-btn">查看原图</button>
                                </div>
                            </div>
                            <div class="photo-info">
                                <div class="photo-name" title="${photo.filename}">${photo.filename}</div>
                                <div class="photo-meta">
                                    <div class="photo-size">${formatSize(photo.size)}</div>
                                    <button class="download-btn" onclick="downloadPhoto('${photo.filename}')">下载</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('加载照片失败:', error);
                photosGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">⚠️</div>
                        <p>加载失败，请检查服务器是否运行</p>
                    </div>
                `;
            }
        }

        // 打开模态框
        function openModal(filename) {
            const imageUrl = `/uploads/${filename}`;
            modalImage.src = imageUrl;
            modalDownload.onclick = () => downloadPhoto(filename);
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭模态框
        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 点击模态框背景关闭
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // ESC 键关闭模态框
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // 下载照片
        function downloadPhoto(filename) {
            const link = document.createElement('a');
            link.href = `/api/download/${filename}`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // 刷新按钮
        refreshBtn.addEventListener('click', loadPhotos);

        // 初始化
        generateQRCode();
        loadPhotos();
    </script>
</body>
</html>
