<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laka 竞品页面画廊</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2'%3E%3Crect x='3' y='4' width='18' height='16' rx='2.5'/%3E%3Ccircle cx='9' cy='10' r='1.5'/%3E%3Cpath d='M21 15l-4.5-4.5L7 20'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="notranslate">
  <!-- 全屏拖拽遮罩提示 -->
  <div class="drag-overlay hidden" id="dragOverlay">
    <div class="drag-overlay-box">
      <svg class="icon-svg drag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <div class="drag-overlay-title">松手立即导入（支持批量图片 + iPhone 录屏）</div>
      <div class="drag-overlay-sub">上传后全自动切页面、拼长规则图、打好中文分类标签</div>
    </div>
  </div>

  <div class="gallery-shell">
    <!-- 紧凑单行顶栏 -->
    <header
      class="compact-header annotatable"
      data-spec-key="gallery-header"
      data-spec-title="紧凑顶栏与批量上传入口"
      data-spec-note="人工只需点击上传或把多张截图/录屏直接拖进网页，后续切帧、长图拼接与中文分类打标全部自动完成；支持关键词秒搜与列数密度切换。"
    >
      <div class="header-left">
        <div class="logo-mark">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
          </svg>
          <h1>Laka 竞品页面画廊</h1>
        </div>
        <span class="total-pill" id="totalCountPill">0 页</span>

        <div class="search-box">
          <svg class="icon-svg search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="searchInput"
            name="q"
            placeholder="搜页面词 / 按钮 / 阿语（如 For You、PK、VIP、Hi）..."
          />
        </div>
      </div>

      <div class="header-right">
        <div class="density-group" role="group" aria-label="每行展示密度">
          <button type="button" class="density-btn" data-cols="7">小图 7列</button>
          <button type="button" class="density-btn active" data-cols="6">标准 6列</button>
          <button type="button" class="density-btn" data-cols="4">大图 4列</button>
        </div>

        <label class="toggle-merged-label" title="录屏自动拼成长图后，默认隐藏被合并进去的零散分屏帧以保持清爽">
          <input type="checkbox" id="chkShowMerged" name="showMerged" />
          <span>显示长图拆分帧</span>
        </label>

        <button type="button" class="btn btn-ghost" id="btnSyncInbox" title="将当前筛选出的页面一键备份至 ../laka/pm-inbox/raw/">
          <span>同步至收件箱</span>
        </button>

        <button type="button" class="btn btn-paste" id="btnPasteClipboard" title="复制截图后点此直接粘贴（或直接在页面任意位置按 ⌘V / Ctrl+V）">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          </svg>
          <span>粘贴截图 (⌘V)</span>
        </button>

        <button type="button" class="btn btn-primary" id="btnUploadTrigger">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>上传截图 / 录屏（可多选）</span>
        </button>
        <input
          type="file"
          id="fileUploadInput"
          name="uploadFiles"
          multiple
          accept=".mov,.mp4,.m4v,.webm,.png,.jpg,.jpeg,.webp"
          hidden
        />
      </div>
    </header>

    <!-- 悬浮进度/状态轻提示 -->
    <div class="status-strip hidden" id="statusBanner"></div>

    <!-- 双行直观筛选胶囊栏 -->
    <section
      class="filter-bar annotatable"
      data-spec-key="filter-chips-bar"
      data-spec-title="竞品与页面类型一键筛选栏"
      data-spec-note="自动统计各竞品与页面类型的截图数量，点击胶囊即可组合筛选。"
    >
      <div class="filter-row">
        <span class="filter-label">竞品</span>
        <div class="chip-scroll" id="competitorFilterRow"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">页面</span>
        <div class="chip-scroll" id="pageTypeFilterRow"></div>
      </div>
      <div class="filter-row hidden" id="subTagFilterRowWrap">
        <span class="filter-label">子标</span>
        <div class="chip-scroll" id="subTagFilterRow"></div>
      </div>
    </section>

    <!-- 高密度手机页面墙 -->
    <main
      class="screen-wall cols-6 annotatable"
      id="screenWall"
      data-spec-key="compact-screen-wall"
      data-spec-title="高密度竞品页面缩略墙"
      data-spec-note="每张卡片自动展示识别出的中文页面标题、竞品胶囊与页面类型胶囊；点击任意胶囊可就地弹出菜单一键换标，点击缩略图展开右侧高清详情抽屉。"
    ></main>
  </div>

  <!-- 点击卡片标签胶囊时弹出的快捷切换浮层 -->
  <div class="tag-popover hidden" id="tagPopover">
    <div class="tag-popover-head" id="tagPopoverTitle">点击切换标签</div>
    <div class="tag-popover-grid" id="tagPopoverOptions"></div>
    <div class="tag-popover-add hidden" id="tagPopoverAddBox">
      <input
        type="text"
        id="newSubTagInput"
        name="newSubTag"
        placeholder="新增子标签（如 VIP看板）"
        maxlength="24"
      />
      <button type="button" class="btn btn-primary btn-xs" id="btnAddNewSubTag">添加</button>
    </div>
  </div>

  <!-- 点击任意缩略图滑出的高清详情与文案抽屉 -->
  <div class="detail-drawer-wrap hidden" id="detailDrawerWrap">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <aside class="detail-drawer" aria-label="页面高清详情">
      <div class="detail-header">
        <div class="detail-title-group">
          <input
            type="text"
            class="detail-title-input"
            id="drawerTitleInput"
            name="drawerTitle"
            title="点击可直接修改页面标题，失焦自动保存"
          />
          <div class="detail-tags-inline" id="drawerTagPills"></div>
        </div>
        <div class="detail-nav-btns">
          <button type="button" class="btn btn-ghost btn-sm" id="btnPrevPage" title="键盘左键 ←">上一页</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnNextPage" title="键盘右键 →">下一页</button>
          <button type="button" class="btn btn-danger-ghost btn-sm" id="btnDeleteCurrent">删除此页</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnCloseDrawer" title="Esc 关闭">关闭</button>
        </div>
      </div>

      <div class="detail-body">
        <div class="detail-preview-pane">
          <img id="drawerPreviewImg" src="" alt="Screen preview" />
        </div>

        <div class="detail-info-pane">
          <div class="info-block">
            <div class="info-block-title">自动识别页面结构亮点</div>
            <div class="highlights-list" id="drawerHighlights"></div>
          </div>

          <div class="info-block">
            <div class="info-block-title">个人备注（输入自动保存）</div>
            <textarea
              id="drawerNoteInput"
              name="drawerNote"
              rows="2"
              class="drawer-note-input"
              placeholder="随手记一句参考点，如：右侧悬浮礼盒与 FREE x3 免费私信钩子可参考..."
            ></textarea>
          </div>

          <div class="info-block grow-block">
            <div class="info-head-between">
              <span class="info-block-title">识别出的界面文案与规则（已过滤状态栏）</span>
              <button type="button" class="btn btn-ghost btn-xs" id="btnCopyDrawerOcr">一键复制</button>
            </div>
            <textarea id="drawerOcrText" name="drawerOcr" class="drawer-ocr-box" readonly></textarea>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- 右下角极简收起的「原型注释」浮动面板（默认关闭拦截） -->
  <aside class="annotation-panel collapsed" id="annotationPanel" aria-label="原型注释编辑器">
    <div class="annotation-panel-header" id="annotationDragHandle">
      <div class="annotation-header-title">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>原型注释</span>
      </div>
      <div class="annotation-header-controls">
        <label class="mode-switch-pill" title="默认关闭以保证画廊直接可点；勾选后可点击模块编辑组件说明">
          <input type="checkbox" id="annotationModeCheckbox" name="annotationMode" />
          <span>注释模式</span>
        </label>
        <button type="button" class="annotation-collapse-btn" id="btnCollapseAnnotation" title="展开/收起">
          +
        </button>
      </div>
    </div>

    <div class="annotation-panel-body" id="annotationPanelBody">
      <div class="annotation-status-row">
        <span class="annotation-key-badge" id="annActiveKey">未选择模块</span>
        <span class="annotation-save-state" id="annSaveStatus">已同步</span>
      </div>
      <div class="annotation-field">
        <label for="annTitleInput">模块名称</label>
        <input type="text" id="annTitleInput" name="annTitle" />
      </div>
      <div class="annotation-field">
        <label for="annNoteInput">组件批注</label>
        <textarea id="annNoteInput" name="annNote" rows="4"></textarea>
      </div>
      <div class="annotation-pills" id="annModulePills"></div>
      <div class="annotation-actions">
        <button type="button" class="btn btn-primary btn-sm" id="btnSaveAnnotation">保存注释</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnExportOfflineHtml">导出 HTML</button>
      </div>
    </div>
    <div class="annotation-resize-handle" id="annotationResizeHandle"></div>
  </aside>

  <script src="sessions/sessions-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
