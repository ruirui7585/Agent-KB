<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Laka 后台 · 1v1 心愿礼物配置（原型）</title>
<style>
:root{
  --p:#7c5cf6; --p-d:#6a48e0; --p-l:#f1edfe; --p-l2:#f7f5fe;
  --bg:#f4f5f7; --card:#fff; --bd:#e8e8ee; --bd2:#f0f0f4;
  --tx:#1f2430; --tx2:#5b6270; --tx3:#939aa8;
  --grn:#16a34a; --grn-l:#e7f7ee; --red:#ef4444; --red-l:#fdeaea;
  --amb:#f59e0b; --amb-l:#fef6e7; --blu:#3b82f6;
  --sh:0 1px 3px rgba(20,20,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
/* ===== left nav ===== */
.nav{width:210px;background:#21263a;color:#c7ccd9;flex-shrink:0;padding:16px 0;position:sticky;top:0;height:100vh;overflow:auto}
.nav .logo{display:flex;align-items:center;gap:9px;padding:4px 18px 18px;font-size:16px;font-weight:800;color:#fff}
.nav .logo i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--p),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:14px}
.nav .grp{font-size:11px;color:#6b7088;padding:12px 18px 6px;letter-spacing:.5px}
.nav .it{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;cursor:pointer;border-left:3px solid transparent;color:#c7ccd9}
.nav .it:hover{background:#2a3048;color:#fff}
.nav .it .ic{width:18px;text-align:center;opacity:.85}
.nav .it.sub{padding-left:46px;font-size:12.5px}
.nav .it.active{background:#2f2447;border-left-color:var(--p);color:#fff;font-weight:600}
.nav .it.active .ic{color:#c4b5fd}
/* ===== main ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.crumbs{font-size:12.5px;color:var(--tx3)}
.crumbs b{color:var(--tx);font-weight:600}
.crumbs .cur{color:var(--p);font-weight:600}
.topbar .right{display:flex;align-items:center;gap:14px}
.topbar .who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.topbar .av{width:28px;height:28px;border-radius:50%;background:var(--p-l);color:var(--p-d);display:flex;align-items:center;justify-content:center;font-weight:700}
.badge-env{font-size:10.5px;background:var(--amb-l);color:#b5780a;border:1px solid #f5e3bd;border-radius:5px;padding:3px 8px;font-weight:700}
.content{padding:20px 22px 40px;min-height:calc(100vh - 54px)}
/* ===== panel (state test) ===== */
.panel{width:286px;background:#fff;border-left:1px solid var(--bd);flex-shrink:0;padding:14px 14px 30px;position:sticky;top:0;height:100vh;overflow:auto;font-size:12px}
.panel h4{font-size:12px;color:var(--tx2);margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;gap:6px}
.panel h4:first-child{margin-top:0}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{border:1px solid var(--bd);background:#fafafc;border-radius:6px;padding:5px 9px;cursor:pointer;font-size:11.5px;color:var(--tx2);user-select:none}
.pbtn:hover{border-color:var(--p);color:var(--p)}
.pbtn.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.ptip{font-size:10.5px;color:var(--tx3);margin-top:5px;line-height:1.5}
/* ===== generic ===== */
.page-title{font-size:19px;font-weight:800;margin-bottom:4px}
.page-sub{font-size:12.5px;color:var(--tx3);margin-bottom:16px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd2)}
.card-h .t{font-size:14.5px;font-weight:700}
.card-h .t small{font-size:11px;color:var(--tx3);font-weight:500;margin-left:8px}
.card-b{padding:16px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--tx3);font-weight:600}
.fld input,.fld select{height:32px;border:1px solid var(--bd);border-radius:7px;padding:0 9px;font-size:12.5px;background:#fff;color:var(--tx);min-width:120px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--p)}
.actions{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--bd);background:#fff;border-radius:7px;padding:0 14px;height:32px;font-size:12.5px;cursor:pointer;color:var(--tx2);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.p:hover{background:var(--p-d)}
.btn.ghost{background:var(--p-l);border-color:var(--p-l);color:var(--p-d)}
.btn.danger{border-color:#f3c2c2;color:var(--red);background:#fff}
.btn.danger:hover{background:var(--red-l)}
.btn.sm{height:28px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--bd);color:var(--tx3);background:#f6f6f8}
.btn.lg{height:38px;padding:0 22px;font-size:13.5px}
/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--bd2)}
th{font-size:11.5px;color:var(--tx3);font-weight:700;background:#fafafc;white-space:nowrap}
td{color:var(--tx)}
tr:last-child td{border-bottom:none}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
.st.on{background:var(--grn-l);color:var(--grn)}
.st.off{background:#f1f2f4;color:var(--tx3)}
.st.warn{background:var(--amb-l);color:#b5780a}
.st.red{background:var(--red-l);color:var(--red)}
.st.info{background:var(--p-l);color:var(--p-d)}
.dot{width:7px;height:7px;border-radius:50%}
.link{color:var(--p);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
.tlink{color:var(--p);cursor:pointer}
.op{display:flex;gap:8px;flex-wrap:wrap}
.op a{color:var(--p);cursor:pointer;font-size:12px;white-space:nowrap}
.op a:hover{text-decoration:underline}
.op a.d{color:var(--red)}
.op a.g{color:var(--tx3)}
/* tags */
.tag-lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#f1f2f4;color:var(--tx2);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-weight:600}
.tag-confirm{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--amb-l);color:#b5780a;border:1px solid #f5e3bd;border-radius:6px;padding:3px 8px;font-weight:600;margin:2px 4px 2px 0;display:inline-block}
.tag-readonly{font-size:10.5px;background:#eef0f4;color:var(--tx3);border-radius:5px;padding:2px 7px;font-weight:600;margin-left:6px}
.gicon{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;background:var(--p-l2);border:1px solid var(--bd2)}
.kv{font-family:"SF Mono",Consolas,monospace;font-size:11px;color:var(--p-d);background:var(--p-l);border-radius:4px;padding:1px 6px}
.lockic{color:var(--tx3)}
/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.fitem{display:flex;flex-direction:column;gap:6px}
.fitem.full{grid-column:1/-1}
.fitem > label{font-size:12.5px;font-weight:600;color:var(--tx)}
.fitem .hint{font-size:11px;color:var(--tx3);line-height:1.5}
.fitem .err{font-size:11px;color:var(--red);display:none}
.fitem.invalid .err{display:block}
.fitem.invalid input,.fitem.invalid select{border-color:var(--red)}
.finput,.fsel{height:34px;border:1px solid var(--bd);border-radius:7px;padding:0 10px;font-size:12.5px;background:#fff;outline:none}
.finput:focus,.fsel:focus{border-color:var(--p)}
.finput[readonly]{background:#f6f6f8;color:var(--tx3);cursor:not-allowed}
.seg{display:inline-flex;background:#eee;border-radius:8px;padding:3px}
.seg span{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap}
.seg span.on{background:#fff;color:var(--p);box-shadow:var(--sh)}
.switch{position:relative;width:42px;height:23px;background:#cfd3dc;border-radius:20px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--p)}
.switch i{position:absolute;top:2px;left:2px;width:19px;height:19px;background:#fff;border-radius:50%;transition:.2s}
.switch.on i{left:21px}
/* summary bar */
.sumbar{display:flex;flex-wrap:wrap;gap:26px;padding:14px 16px;background:linear-gradient(135deg,#faf8ff,#fff);border:1px solid var(--bd);border-radius:10px;margin-bottom:16px}
.sumbar .si .k{font-size:11px;color:var(--tx3);font-weight:600}
.sumbar .si .v{font-size:14px;font-weight:800;margin-top:3px}
/* module nav */
.modnav{display:flex;gap:4px;background:#fff;border:1px solid var(--bd);border-radius:9px;padding:5px;margin-bottom:16px;position:sticky;top:54px;z-index:10;overflow:auto}
.modnav a{padding:8px 14px;font-size:12.5px;color:var(--tx2);border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:600}
.modnav a:hover{background:var(--p-l)}
.modnav a.on{background:var(--p);color:#fff}
/* special module folded */
.fold{border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:16px;background:#fff}
.fold-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:#fafafc}
.fold-h .l{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700}
.fold-b{padding:16px;border-top:1px solid var(--bd2);display:none}
.fold.open .fold-b{display:block}
.empty{text-align:center;padding:34px 10px;color:var(--tx3)}
.empty .e-ic{font-size:34px;opacity:.4}
.empty .e-t{margin-top:8px;font-size:13px}
.loading{text-align:center;padding:34px;color:var(--tx3)}
.loading .spin{width:24px;height:24px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{text-align:center;padding:30px;color:var(--red)}
.errbox .e-ic{font-size:34px}
/* overlay / drawer / modal */
.ov{position:fixed;inset:0;background:rgba(20,22,34,.45);z-index:100;display:none;align-items:center;justify-content:center}
.ov.show{display:flex}
.drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:92vw;background:#fff;z-index:101;box-shadow:-6px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:.26s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);font-size:15px;font-weight:700}
.drawer .db{padding:20px;overflow:auto;flex:1}
.modal{background:#fff;border-radius:12px;width:560px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);font-size:15px;font-weight:700}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bd)}
.x{cursor:pointer;color:var(--tx3);font-size:18px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.x:hover{background:#f0f0f4}
/* toast */
.toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--p);border-radius:9px;padding:11px 18px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:center;gap:9px;animation:tin .25s ease}
.toast.ok{border-left-color:var(--grn)}
.toast.err{border-left-color:var(--red)}
.toast .ti{font-size:16px}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
/* sample flag */
.sample-flag{position:fixed;bottom:14px;right:302px;background:#fff;border:1px dashed var(--amb);color:#b5780a;border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:700;z-index:30;box-shadow:var(--sh)}
.anchor-info{display:flex;align-items:center;gap:12px;padding:14px;background:var(--p-l2);border-radius:9px;margin-bottom:14px}
.anchor-info .aa{width:46px;height:46px;border-radius:50%;background:var(--p-l);color:var(--p-d);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ro{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd2);font-size:12.5px}
.ro .k{color:var(--tx3)}
.ro .v{font-weight:600}
.sec-div{font-size:12px;font-weight:700;color:var(--tx2);margin:18px 0 8px;padding-left:9px;border-left:3px solid var(--p)}
.exprt{font-family:"SF Mono",Consolas,monospace;font-size:11.5px;background:#1f2430;color:#cbd5e1;padding:14px;border-radius:9px;white-space:pre-wrap;line-height:1.8}
.exprt .kw{color:#c4b5fd}
.exprt .ok{color:#6ee7a8}
.exprt .no{color:#fca5a5}
.exprt .cm{color:#7c8196}
.pill-tab{display:inline-flex;background:var(--bd2);border-radius:8px;padding:3px}
.pill-tab span{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer}
.pill-tab span.on{background:#fff;color:var(--p);box-shadow:var(--sh)}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT NAV -->
  <aside class="nav">
    <div class="logo"><i>L</i> Laka 运营后台</div>
    <div class="grp">主菜单</div>
    <div class="it"><span class="ic">🏠</span>首页</div>
    <div class="it"><span class="ic">👤</span>用户管理</div>
    <div class="it"><span class="ic">🎤</span>主播管理
      <div style="margin-left:auto;font-size:10px;color:var(--tx3)">›</div>
    </div>
    <div class="it sub" onclick="goAnchor()">心愿礼物资格</div>
    <div class="grp">礼物中心</div>
    <div class="it sub"><span class="ic">🎁</span>礼物管理</div>
    <div class="it sub active"><span class="ic">🎮</span>礼物玩法</div>
    <div class="grp">运营与风控</div>
    <div class="it"><span class="ic">⚙️</span>运营配置</div>
    <div class="it"><span class="ic">🛡️</span>风控管理</div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="right">
        <span class="badge-env">示例数据 SAMPLE DATA</span>
        <div class="who"><span class="av" id="whoAv">A</span><span id="whoName">Admin（超级管理员）</span></div>
      </div>
    </div>
    <div class="content" id="page"></div>
  </main>

  <!-- STATE TEST PANEL -->
  <aside class="panel">
    <h4>🧪 状态测试面板</h4>
    <div class="ptip">点击任意项，后台页面实时切换对应状态。所有数据均为示例。</div>

    <h4>页面 Page</h4>
    <div class="pbtns" id="pgPage"></div>

    <h4>功能状态 Feature</h4>
    <div class="pbtns" id="pgFeature"></div>

    <h4>基础礼物池 Gift Pool</h4>
    <div class="pbtns" id="pgPool"></div>

    <h4>特殊礼物 Special Gift</h4>
    <div class="pbtns" id="pgSpecial"></div>

    <h4>表单状态 Form</h4>
    <div class="pbtns" id="pgForm"></div>

    <h4>权限角色 Role</h4>
    <div class="pbtns" id="pgRole"></div>
  </aside>
</div>

<div class="sample-flag">⚠ 本原型全部为示例数据 SAMPLE DATA，非真实后台</div>
<div class="toasts" id="toasts"></div>

<script>
/* ===================== STATE ===================== */
const S = {
  page:'list',            // list | config | anchor | log
  feature:true,           // 心愿功能启用
  pool:'normal',          // normal | empty | loading | error
  special:'off',          // off | empty | on-empty | on-gifts | rule-off | rule-on
  form:'normal',          // normal | dirty | invalid | saving | success | fail
  role:'super',           // super | op | risk | read
  // config-page transient UI
  targetMode:'unified',   // unified | per-item
  specialOn:false,
  specialRuleOn:false,
  qtyMode:'auto',         // auto | manual
  outOfRange:'hide',      // hide | forbid | prompt
};

/* ===================== DATA (sample) ===================== */
const GIFTS = [
  {id:'G1021',name:'Rose',ic:'🌹',price:44,qty:[1,2,5,10,20],total:880,sort:1,on:true},
  {id:'G1033',name:'Lily',ic:'🌷',price:99,qty:[1,2,5,10],total:990,sort:2,on:true},
  {id:'G1009',name:'Crystal Heart',ic:'💗',price:199,qty:[1,2,5],total:995,sort:3,on:true},
  {id:'G1055',name:'Royal Crown',ic:'👑',price:520,qty:[1,2],total:1040,sort:4,on:false},
];
const SPECIAL = [
  {id:'G2001',name:'Golden Rose',ic:'🌹',price:999,qty:1,anim:'anim_sp_001',thanks:'Thank you for making my wish come true! 💖',inti:20,on:true},
  {id:'G2002',name:'Star Diamond',ic:'💎',price:1314,qty:1,anim:'anim_sp_002',thanks:'You are my shining star ✨',inti:50,on:true},
];
const ANCHORS = [
  {id:'A88231',name:'Layla',region:'🇸🇦 沙特',gift:true,earn:3120,payers:14,days:7,sp:'已解锁',ver:'v2',unlock:'2026-07-28 09:12',risk:'正常'},

  {id:'A90155',name:'Yara',region:'🇪🇬 埃及',gift:false,earn:0,payers:0,days:0,sp:'未解锁',ver:'-',unlock:'-',risk:'暂停收礼'},
];
const LOGS = [
  {time:'2026-08-03 10:30',user:'Admin',mod:'心愿礼物配置',obj:'GP1008',type:'发布配置',before:'v2',after:'v3',effect:'立即生效',reason:'调整目标价值区间 800-1200',res:'成功',ver:'v3'},
  {time:'2026-08-02 16:45',user:'Ops_Lina',mod:'基础礼物池',obj:'G1021',type:'编辑规则',before:'qty 1/2/5',after:'qty 1/2/5/10/20',effect:'2026-08-03 00:00',reason:'放开 Rose 目标数量',res:'成功',ver:'v2'},
  {time:'2026-08-01 11:20',user:'Risk_Kai',mod:'主播特殊资格',obj:'A90155',type:'暂停资格',before:'正常',after:'暂停收礼',effect:'立即生效',reason:'风控命中异常收礼',res:'成功',ver:'-'},
  {time:'2026-07-31 14:08',user:'Ops_Lina',mod:'特殊礼物解锁规则',obj:'GP1008',type:'创建规则版本',before:'-',after:'v2',effect:'2026-08-01 00:00',reason:'首批解锁阈值配置',res:'成功',ver:'v2'},
  {time:'2026-07-30 09:50',user:'Admin',mod:'心愿礼物配置',obj:'GP1008',type:'发布配置',before:'v1',after:'v2',effect:'立即生效',reason:'首次上线',res:'成功',ver:'v2'},
];

/* ===================== ROLE PERMISSIONS ===================== */
const ROLE = {
  super:{name:'Admin（超级管理员）',perm:{view:1,edit:1,publish:1,stop:1,manageAnchor:1,log:1,risk:1}},
  op:{name:'Ops_Lina（运营管理员）',perm:{view:1,edit:1,publish:0,stop:1,manageAnchor:0,log:1,risk:0}},
  risk:{name:'Risk_Kai（风控管理员）',perm:{view:1,edit:0,publish:0,stop:0,manageAnchor:1,log:1,risk:1}},
  read:{name:'Viewer（只读账号）',perm:{view:1,edit:0,publish:0,stop:0,manageAnchor:0,log:1,risk:0}},
};
function can(k){return !!ROLE[S.role].perm[k];}

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':(''+s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.innerHTML='<span class="ti">'+(type==='ok'?'✅':type==='err'?'⚠️':'ℹ️')+'</span>'+esc(msg);
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600);
}
function statusTag(on,onTxt,offTxt){
  return on?'<span class="st on"><span class="dot" style="background:var(--grn)"></span>'+(onTxt||'启用')+'</span>'
          :'<span class="st off"><span class="dot" style="background:#c0c4cc"></span>'+(offTxt||'停用')+'</span>';
}

/* ===================== PANEL BUILD ===================== */
const PG = {
  page:[['list','礼物玩法列表'],['config','心愿礼物配置'],['anchor','主播资格管理'],['log','操作日志']],
  feature:[['true','功能启用'],['false','功能停用']],
  pool:[['normal','正常数据'],['empty','空数据'],['loading','加载中'],['error','加载失败']],
  special:[['off','未启用'],['on-empty','已启用·池空'],['on-gifts','已启用·有礼物'],['rule-off','解锁规则未配'],['rule-on','解锁规则已配']],
  form:[['normal','正常'],['dirty','未保存修改'],['invalid','校验失败'],['saving','保存中'],['success','保存成功'],['fail','保存失败']],
  role:[['super','超级管理员'],['op','运营管理员'],['risk','风控管理员'],['read','只读账号']],
};
function buildPanel(){
  const map={page:'pgPage',feature:'pgFeature',pool:'pgPool',special:'pgSpecial',form:'pgForm',role:'pgRole'};
  for(const k in map){
    const box=$('#'+map[k]); box.innerHTML='';
    PG[k].forEach(([v,lbl])=>{
      const b=document.createElement('div');
      b.className='pbtn';
      let on=false;
      if(k==='page')on=S.page===v;
      else if(k==='feature')on=(S.feature===true)+''===v;
      else if(k==='pool')on=S.pool===v;
      else if(k==='special')on=S.special===v;
      else if(k==='form')on=S.form===v;
      else if(k==='role')on=S.role===v;
      if(on)b.classList.add('on');
      b.textContent=lbl;
      b.onclick=()=>setState(k,v);
      box.appendChild(b);
    });
  }
}
function setState(k,v){
  if(k==='page')S.page=v;
  else if(k==='feature')S.feature=v==='true';
  else if(k==='pool')S.pool=v;
  else if(k==='special'){S.special=v; if(v==='off'){S.specialOn=false;S.specialRuleOn=false;} else {S.specialOn=true; S.specialRuleOn=(v==='rule-on');}}
  else if(k==='form')S.form=v;
  else if(k==='role')S.role=v;
  render();
}

/* ===================== RENDER SWITCH ===================== */
function render(){
  buildPanel();
  $('#whoName').textContent=ROLE[S.role].name;

}

function delGift(id){
  const g=GIFTS.find(x=>x.id===id); if(!g)return;
  openModal('<div class="mh">删除确认<div class="x" onclick="closeModal()">✕</div></div>'+
    '<div class="mb"><p>确认从基础心愿礼物池删除 <b>'+g.name+'</b>（'+g.id+'）？</p>'+

    '<div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="doDelGift(\''+id+'\')">确认删除</button></div>');
}
function doDelGift(id){
  const i=GIFTS.findIndex(x=>x.id===id); if(i>=0)GIFTS.splice(i,1);
  closeModal(); S.form='dirty'; render(); toast('已删除礼物');
}

  <div class="mb">

function selCand(id){
  const c={G1066:{name:'Sunflower',ic:'🌻',price:66},G1071:{name:'Bluebell',ic:'🔔',price:88},G1044:{name:'Old Rose',ic:'🥀',price:30,disabled:true}}[id];

  window._cand={id,...c};
  $('#addChosen').textContent='已选：'+c.ic+' '+c.name+'（'+id+' · 💎'+c.price+'）';
  $('#addForm').style.display='block';
  $('#addConfirm').style.display='inline-flex';
  // recompute preview live
  document.querySelectorAll('.addq').forEach(ch=>ch.onchange=updPrev);
}
function updPrev(){
  if(!window._cand)return;
  const qs=[...document.querySelectorAll('.addq')].filter(c=>c.checked).map(c=>+c.value);
  if(!qs.length){$('#addPreview').textContent='—';return;}
  const vals=qs.map(q=>window._cand.price*q);
  $('#addPreview').textContent='💎 '+vals.join(' / ')+' （'+window._cand.price+' × 目标数量）';
}
function confirmAdd(){
  if(!window._cand){toast('请先选择礼物','err');return;}
  const qs=[...document.querySelectorAll('.addq')].filter(c=>c.checked).map(c=>+c.value);
  if(!qs.length){toast('请至少选择一个目标数量','err');return;}
  // value-range check (sample rule 800-1200)
  const ok=qs.some(q=>{const t=window._cand.price*q;return t>=800&&t<=1200;});
  if(!ok){toast('目标总价值不满足规则（须 800–1200），示例数据','err');return;}
  const sort=document.getElementById('addSort').value;
  GIFTS.push({id:window._cand.id,name:window._cand.name,ic:window._cand.ic,price:window._cand.price,qty:qs,total:window._cand.price*qs[qs.length-1],sort:+sort||GIFTS.length+1,on:true});
  closeModal(); S.form='dirty'; S.pool='normal'; render(); toast('已添加礼物到心愿池（示例）');
}

function publish(){
  if(!can('publish')){toast('当前角色无发布权限（仅超级管理员可发布）','err');return;}
  if(S.form==='invalid'){toast('表单校验未通过，无法发布','err');return;}
  if(S.form==='dirty'){
    openModal('<div class="mh">未保存修改<div class="x" onclick="closeModal()">✕</div></div>'+
      '<div class="mb"><p>当前有未保存的修改，发布将一并提交。确认发布配置 v3？</p></div>'+
      '<div class="mf"><button class="btn" onclick="closeModal()">取消</button><button class="btn p" onclick="doPublish()">确认发布</button></div>');
    return;
  }
  doPublish();
}
function doPublish(){
  closeModal(); S.form='saving'; render();
  setTimeout(()=>{
    // simulate success/fail based on panel state
    if(S.form==='fail'){S.form='fail';render();toast('发布失败：网络异常，请重试','err');return;}
    S.form='success'; render(); toast('✅ 配置发布成功 · 版本 v3 已生效','ok');
  },800);
}

/* ===================== OVERLAY / DRAWER / MODAL ===================== */
function openModal(html,scroll){
  let ov=document.getElementById('ovModal');
  if(!ov){ov=document.createElement('div');ov.className='ov';ov.id='ovModal';document.body.appendChild(ov);}
  ov.innerHTML=`<div class="modal">${html}</div>`;
  if(scroll)ov.querySelector('.modal').style.overflow='auto';
  ov.classList.add('show');
  ov.onclick=e=>{if(e.target===ov)closeModal();};
}
function closeModal(){const ov=document.getElementById('ovModal');if(ov){ov.classList.remove('show');ov.innerHTML='';}}
function openDrawer(title,html){
  let dr=document.getElementById('dr');
  if(!dr){dr=document.createElement('div');dr.className='drawer';dr.id='dr';document.body.appendChild(dr);
    const bg=document.createElement('div');bg.className='ov';bg.id='drBg';bg.style.alignItems='flex-end';bg.style.justifyContent='flex-end';
    bg.onclick=closeDrawer;document.body.appendChild(bg);}
  dr.innerHTML=`<div class="dh">${title}<div class="x" onclick="closeDrawer()">✕</div></div><div class="db">${html}</div>`;
  document.getElementById('drBg').classList.add('show');
  requestAnimationFrame(()=>dr.classList.add('show'));
}
function closeDrawer(){const dr=document.getElementById('dr');if(dr)dr.classList.remove('show');const bg=document.getElementById('drBg');if(bg)bg.classList.remove('show');}
