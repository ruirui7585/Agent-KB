:#f5f4f7;color:#a127c8;font-size:40px}.profile-titles .badge{width:128px;height:29px}.gift-row{display:flex;gap:8px}.gift-row span{background:#f5f4f7;border-radius:10px;width:18%;height:58px;display:grid;place-items:center;font-size:26px;color:#c8a559}.flash{outline:2px solid #f4d779;box-shadow:0 0 20px #f0cd7177}.toast{max-width:calc(100vw - 24px);white-space:normal;text-align:center}.test-panel{max-height:calc(100vh - 48px);overflow:auto}.test-panel .status{line-height:1.7}.honor-card{cursor:pointer}.honor-card .seal{background-image:var(--medal-1-image);background-size:contain;background-position:center;border:0;border-radius:0;color:transparent}.honor-card:nth-of-type(4) .seal{background-image:var(--title-bd-image);width:70px}.screen:not(.my-page):not(.profile-page){padding-bottom:40px}@media(max-width:760px){.phone{width:390px;margin:auto}.test-panel{max-height:none;overflow:visible;margin-top:16px}.stage{background:#e7e3e8}.title-card h4{font-size:11px}.slot .badge{font-size:6px}.badge{max-width:100%}.toast{bottom:30px}}
.slot .badge b{font-size:6px;line-height:1.15}.slot .badge i{font-size:8px}.mini-profile-card{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e6dce7;border-radius:16px;margin-top:14px;padding:14px}.mini-profile-card .avatar{width:45px;height:45px;display:inline-block;vertical-align:middle;margin-right:10px;border:0;box-shadow:none}.mini-profile-card .mini-titles{margin-bottom:0}.mini-profile-card .badge{width:98px;height:24px;font-size:7px} .honor-card:last-child .seal{background-image:var(--title-bd-image);background-repeat:no-repeat;background-size:contain;background-position:center;width:70px;height:65px;flex-shrink:0} </style></head>
<body><main class="stage"><div class="phone" id="app"></div><aside class="test-panel"><h2>Prototype Test / Migration</h2><small>State is isolated by simulated account and persists locally.</small><label>Simulated account</label><select id="accountSelect"></select><label>Legacy scenario</label><select id="scenarioSelect"></select><div class="test-buttons"><button class="primary" id="upgradeBtn">Upgrade to New Version</button><button id="reloginBtn">Simulate relogin</button><button id="repeatBtn">Repeat upgrade check</button><button id="expireBtn">Expire selected title</button><button id="failBtn">Fail next save</button><button id="resetBtn">Reset current account</button><button id="cancelAllBtn">Cancel all titles</button></div><label>Expire selected title</label><select id="expireSelect"></select><label>Old version worn</label><div class="old-list" id="oldList"></div><label>New version worn</label><div class="new-list" id="newList"></div><div class="test-buttons"><button data-panel-nav="my">My</button><button data-panel-nav="profile">Self Profile</button><button data-panel-nav="other">Other Profile</button><button data-panel-nav="voice">Voice</button></div><div class="status" id="testStatus"></div><p class="responsive-note">Test controls collapse below the phone on smaller screens.</p></aside></main><div class="toast" id="toast"></div>
<script>
(() => {
  const KEY='laka-honorship-prototype-v1';
  const titles=[
    ['bd-partner','BD PARTNER','Partner','gold'],['new-comer','NEW COMER','Welcome to Laka','blue'],['top-friend','TOP FRIEND','A trusted friend','gold'],['wealth-ii','WEALTH MEDAL II','Generous spirit','gold'],['charm-i','CHARM MEDAL I','Magnetic presence','blue'],['companion','COMPANION MEDAL','Always together','gold'],['voice-star','VOICE STAR','Room favorite','blue'],['night-owl','NIGHT OWL','Late night regular','gold'],['laka-icon','LAKA ICON','Community legend','gold'],['kind-soul','KIND SOUL','Kindness counts','blue'],['trend-setter','TREND SETTER','Style leader','gold'],['royal-host','ROYAL HOST','Host with grace','gold']
  ];
  const tmap=Object.fromEntries(titles.map(x=>[x[0],x]));
  const scenarios={empty:{label:'Empty / no titles',owned:[],legacy:[]},own5wear1:{label:'Own 5, wear 1',owned:['bd-partner','new-comer','top-friend','wealth-ii','charm-i'],legacy:['bd-partner']},wear3:{label:'Wear 3',owned:['bd-partner','new-comer','top-friend'],legacy:['bd-partner','new-comer','top-friend']},wear5:{label:'Wear 5',owned:['bd-partner','new-comer','top-friend','wealth-ii','charm-i'],legacy:['bd-partner','new-comer','top-friend','wealth-ii','charm-i']},wear9:{label:'Wear 9',owned:titles.slice(0,9).map(x=>x[0]),legacy:titles.slice(0,9).map(x=>x[0])},over9:{label:'Legacy over 9',owned:titles.slice(0,12).map(x=>x[0]),legacy:titles.slice(0,12).map(x=>x[0])},expired:{label:'Expired legacy title',owned:['bd-partner','new-comer','top-friend'],legacy:['bd-partner','new-comer','top-friend'],expired:['new-comer']},dirty:{label:'Dirty duplicate / foreign records',owned:['bd-partner','new-comer','top-friend'],legacy:['bd-partner','bd-partner','unknown','new-comer','royal-host','top-friend']}};
  const defaults={rui:{name:'rui rui',owned:['bd-partner','new-comer','top-friend','wealth-ii','charm-i'],legacy:['bd-partner','new-comer','top-friend'],expired:[],migrated:true},guest:{name:'Guest account',owned:[],legacy:[],expired:[]},legacy:{name:'Legacy tester',owned:titles.slice(0,12).map(x=>x[0]),legacy:titles.slice(0,12).map(x=>x[0]),expired:[]}};
  let data=load(); let page='my'; let selectedScenario='wear3'; let profileTab='Profile'; let medalTab='Honor'; let medalManage=false; let selectedId=null; let failNext=false;
  function fresh(d){const migrated=!!d.migrated;return {name:d.name,owned:[...(d.owned||[])],legacy:[...(d.legacy||[])],expired:[...(d.expired||[])],worn:migrated?[...(d.legacy||[])].slice(0,3):[],initialized:migrated,oldWorn:[...(d.legacy||[])],messages:[],medalWorn:[]}}
  function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.accounts)return v}catch(e){}return {accounts:Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,fresh(v)])),account:'rui'}}
  function save(next){if(failNext){failNext=false;toast('Failed to update. Please try again.');updatePanel();return false}try{const copy=JSON.parse(JSON.stringify(next));localStorage.setItem(KEY,JSON.stringify(copy));data=copy;return true}catch(e){toast('Failed to update. Please try again.');return false}}
  function transaction(mutator,ok){const next=JSON.parse(JSON.stringify(data));mutator(next);if(!save(next))return false;if(ok)ok();return true}
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
  function accountFrom(state){return state.accounts[state.account]}
  function account(){return data.accounts[data.account]}
  function valid(id){const a=account();return !!tmap[id]&&a.owned.includes(id)&&!a.expired.includes(id)}
  function migrate(){const a=account();if(a.initialized){toast('Already initialized; current choices kept.');return false}const ok=transaction(next=>{const x=accountFrom(next),seen=new Set(),out=[];for(const id of (x.legacy||[])){if(out.length>=9)break;if(x.owned.includes(id)&&!x.expired.includes(id)&&tmap[id]&&!seen.has(id)){seen.add(id);out.push(id)}}x.worn=out;x.initialized=true;x.oldWorn=[...(x.legacy||[])]},()=>toast('Upgrade complete. Legacy titles inherited.'));render();return ok}
  function titleName(id){return tmap[id]?tmap[id][1]:id}
  function nav(p){if(!['my','honor','title','medal','profile','other','voice'].includes(p)){toast('This feature is outside this prototype.');return}page=p;render();document.getElementById('app').scrollIntoView({block:'start'})}
  function equip(id){if(!account().initialized){toast('Upgrade this simulated account first.');return false}if(!valid(id)){toast('This title is no longer available.');return false}if(account().worn.includes(id)){toast('Already equipped.');return false}if(account().worn.length>=9){toast('You can wear up to 9 titles.');return false}return transaction(next=>{const a=accountFrom(next);a.worn.push(id)},()=>toast('Title equipped.'))&& (render(),true)}
  function cancel(id){if(!account().worn.includes(id))return false;return transaction(next=>{const a=accountFrom(next);a.worn=a.worn.filter(x=>x!==id)},()=>toast('Title removed.'))&&(render(),true)}
  function cancelAll(){return transaction(next=>{accountFrom(next).worn=[]},()=>toast('All titles removed.'))&&(render(),true)}
  function expire(id){if(!id||!account().owned.includes(id)){toast('Select an owned title first.');return false}return transaction(next=>{const a=accountFrom(next);a.expired=Array.from(new Set([...a.expired,id]));a.worn=a.worn.filter(x=>x!==id)},()=>toast('This title is no longer available.'))&&(render(),true)}
  function reset(){selectedId=null;return transaction(next=>{next.accounts[next.account]=fresh({...defaults[next.account],migrated:false})},()=>toast('Current account reset.'))&&(render(),true)}
  function applyScenario(key){const sc=scenarios[key];if(!sc)return false;selectedId=null;return transaction(next=>{const a=accountFrom(next);a.scenario=key;a.owned=[...sc.owned];a.legacy=[...sc.legacy];a.oldWorn=[...sc.legacy];a.expired=[...(sc.expired||[])];a.worn=[];a.initialized=false;a.messages=[]},()=>toast('Scenario loaded.'))&&(render(),true)}
  function badge(id){const x=tmap[id]||['','UNKNOWN','','gold'];return `<span class="badge ${x[3]==='blue'?'blue':''} ${id==='bd-partner'?'real-bd':id==='new-comer'?'real-new':''}" title="${x[1]}">${id==='bd-partner'||id==='new-comer'?'':`<i>✦</i><b>${x[1]}</b><i>✦</i>`}</span>`}
  function topbar(title,dark=false){return `<header class="topbar ${dark?'dark':''}"><button class="back" data-action="back">‹</button><h1>${title}</h1><span class="icon"${title==='Title Center'?' style="visibility:hidden" aria-hidden="true"':''}>⋯</span></header>`}
  function navBar(active='mine'){return `<nav class="bottom-nav">${[['home','⌂','Home'],['moment','◈','Moment'],['party','♢','Party'],['message','✉','Message'],['mine','●','Mine']].map(x=>`<button class="${active===x[0]?'active':''}" data-action="nav" data-page="${x[0]==='mine'?'my':x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('')}</nav>`}
  function renderMy(){const a=account();return `<div class="screen my-page"><div class="my-head"><div class="status-bar">14:59 <span>▂▃▅ ▰ 77</span></div><button class="my-identity" data-action="nav" data-page="profile"><div class="avatar"></div><div><h2>${a.name}</h2><p>ID: 72692497 ▢</p></div><span class="arrow">›</span></button><div class="stats"><div><strong>1</strong><span>Following</span></div><div><strong>0</strong><span>Friends</span></div><div><strong>35</strong><span>Followers</span></div></div></div><button class="vip" data-action="noop"><strong><span class="vip-gem">◆</span> <em>VIP</em></strong><span>enjoys rich privileges</span><b>›</b></button><div class="grid">${[['income','Income'],['visitor','Visitor'],['tasks','Tasks'],['recharge','Recharge'],['relationship','Relationship'],['honorship','honorship']].map(x=>`<button data-action="${x[0]==='honorship'?'nav':'noop'}" data-page="honor"><span class="grid-icon entry-${x[0]}"></span>${x[1]}</button>`).join('')}</div><div class="list">${[['level','♙','My Level'],['shop','◇','Shop'],['agency','⚐','Agency'],['chat','▱','Chat Center'],['invite','♧','Invite Friends']].map(x=>`<button data-action="noop"><span class="grid-icon">${x[1]}</span>${x[2]}<span class="arrow">›</span></button>`).join('')}</div>${navBar()}</div>`}
  function renderHonor(){return `<div class="dark-page screen">${topbar('Your Honorship',true)}<div class="honor-wrap"><div class="honor-kicker">HONOR</div><h2>Your Honorship</h2><div class="honor-card" data-action="nav" data-page="medal"><div class="seal">✦</div><div><h3>Medal Center</h3><p>Manage medals</p></div><span class="arrow">›</span></div><div class="honor-card" data-action="nav" data-page="title"><div class="seal">♛</div><div><h3>Title Center</h3><p>Wear up to 9 titles</p></div><span class="arrow">›</span></div></div></div>`}
  function renderTitle(){const a=account();return `<div class="title-page screen">${topbar('Title Center')}<section class="slot-area" data-annotation-id="title-slots"><div class="slot-label"><h3>My Titles <span class="tiny">(${a.worn.length}/9)</span></h3><button class="tiny" data-action="nav" data-page="profile">View profile ›</button></div><div class="slot-grid">${Array.from({length:9},(_,i)=>{const id=a.worn[i];return `<button class="slot ${id?'filled':''}" data-action="slot" data-id="${id||''}" data-index="${i}"><small>${i+1}</small>${id?badge(id):'<b>＋</b>'}</button>`}).join('')}</div></section><div class="title-list" data-annotation-id="title-collection"><div class="section-title"><h3>My Collection</h3><span class="tiny">${a.owned.filter(valid).length} available</span></div>${a.owned.length? a.owned.map(id=>{const expired=a.expired.includes(id), worn=a.worn.includes(id);return `<div class="title-card" id="card-${id}">${badge(id)}<div><h4>${titleName(id)}</h4><p>${expired?'Expired · unavailable':(tmap[id]||[])[2]||'Title'}</p></div><button class="wear ${worn?'cancel':''}" data-action="${worn?'cancel':'equip'}" data-id="${id}">${expired?'Expired':(worn?'Cancel':'Wear')}</button></div>`}).join(''):'<div class="card" style="text-align:center;color:var(--muted);padding:26px">No titles in your collection.</div>'}</div></div>`}
  function medalToggle(i){if(!Number.isInteger(i)||i<0||i>3)return false;return transaction(next=>{const a=accountFrom(next);const id='medal-'+i;a.medalWorn=a.medalWorn||[];if(a.medalWorn.includes(id))a.medalWorn=a.medalWorn.filter(x=>x!==id);else if(a.medalWorn.length<10)a.medalWorn.push(id)},()=>toast('Medal updated.'))&&(render(),true)}
  function renderMedal(){const a=account(),w=a.medalWorn||[];return `<div class="medal-page screen">${topbar('Medal Center',true)}<div class="medal-upper"><div class="medal-summary"><strong>My Medals:4</strong><button data-action="medalManage">${medalManage?'Done':'Manage'} ›</button></div><div class="medal-grid">${Array.from({length:10},(_,i)=>`<div class="medal-slot-wrap"><button class="medal-slot ${w[i]?'on':''}" data-action="medalSlot" data-index="${i}">${w[i]?`<span class="medal-art medal-${Number(w[i].split('-')[1])+1}"></span>`:'+'}</button><small>${i+1}</small></div>`).join('')}</div></div><div class="medal-tabs">${['Honor','Activity'].map(x=>`<button class="${medalTab===x?'active':''}" data-action="medalTab" data-tab="${x}">${x}</button>`).join('')}</div><div class="medal-list"><div class="medal-cards">${(medalTab==='Honor'?[0,1,2]:[3]).map(i=>`<button class="medal-item" data-action="medalCard" data-index="${i}"><span class="medal-art medal-${i+1}">${i===3?'✦':''}</span><h4>${['Wealth Medal II','Charm Medal I','Companion Medal','Activity Medal'][i]}</h4>${medalManage?`<span class="medal-action">${w.includes('medal-'+i)?'Cancel':'Wear'}</span>`:''}</button>`).join('')}</div></div></div>`}
  function profileView(other=false){const a=account(),shown=a.worn.slice(0,9);return `<div class="screen profile-page"><div class="hero"><div class="hero-row"><button class="profile-back" data-action="back">‹</button><button class="profile-back" data-action="${other?'noop':'nav'}" data-page="title">${other?'⋯':'✎'}</button></div><div class="identity"><div class="avatar"></div><h2>${a.name} <small>🇨🇳 ✓ <span>● Online</span></small></h2><p>ID: 72692497 ▢</p><div class="identity-tags"><b>♀ 23</b><b>◈ 10</b><b>☆ 3</b></div></div></div><div class="sheet"><div class="stats"><div><span>Friends <strong>0</strong></span></div><div><span>Followers <strong>35</strong></span></div><div><span>Following <strong>1</strong></span></div></div><div class="tabs">${['Profile','Relation','Moment'].map(x=>`<button class="${profileTab===x?'active':''}" data-action="profileTab" data-tab="${x}">${x}</button>`).join('')}</div>${profileTab==='Profile'?`<div class="section-title"><h3>Private Album(1)</h3></div><p class="tiny">Members only! Your photo will not be saved or shared.</p><div class="album"><div class="album-photo"></div><button data-action="noop">+</button></div><div class="section-title"><h3>Bio</h3></div><p style="color:var(--muted)">♧ No tags added yet.</p><div class="section-title"><h3>Title</h3>${other?'':'<button class="tiny" data-action="nav" data-page="title" style="background:transparent;color:#999;font-size:13px">View all ›</button>'}</div><div class="mini-titles profile-titles" data-annotation-id="profile-titles">${shown.map(badge).join('')}</div><div class="section-title"><h3>Gift gallery</h3><button class="tiny" data-action="noop">0.9K ›</button></div><div class="gift-row"><span>❀</span><span>♡</span><span>✦</span><span>♜</span><span>♛</span></div>`:`<div class="card" style="margin-top:18px;text-align:center;color:var(--muted)">${profileTab==='Relation'?'No relationships to display.':'No moments to display.'}</div>`}</div></div>`}
  function voice(){const a=account(),now=a.worn.slice(0,3),msgs=a.messages||[];return `<div class="screen" style="background:#faf6fc">${topbar('Voice Room')}<div style="padding:20px 16px"><div class="card" style="background:linear-gradient(120deg,#3a234d,#8b5e53);color:#fff;height:180px"><div class="tiny" style="color:#eadbf0">LIVE ROOM</div><h2 style="margin-top:8px">Late Night Lounge</h2><p style="opacity:.75">12 people are here</p></div><button class="mini-profile-card" data-action="nav" data-page="profile"><div class="avatar"></div><strong>${a.name}</strong><div class="mini-titles">${now.map(badge).join('')}</div></button><div class="section-title"><h3>Message snapshots</h3><span class="tiny">First 3 titles at send</span></div>${msgs.map(m=>`<div class="card" style="margin:8px 0"><strong>${esc(m.text)}</strong><div class="mini-titles">${m.snapshot.map(id=>`${badge(id)}`).join('')||'<span class="tiny">No titles</span>'}</div></div>`).join('')||'<div class="card" style="color:var(--muted)">Send a message to create an immutable title snapshot.</div>'}<div style="display:flex;gap:8px;margin-top:15px"><input id="messageInput" aria-label="Room message" placeholder="Say hello…" style="min-width:0;flex:1;border:1px solid var(--line);border-radius:20px;padding:11px"><button data-action="send" style="background:#5c2c76;color:#fff;border-radius:20px;padding:0 16px">Send</button></div></div>${navBar('party')}</div>`}
  function render(){let html=page==='my'?renderMy():page==='honor'?renderHonor():page==='title'?renderTitle():page==='medal'?renderMedal():page==='profile'?profileView(false):page==='other'?profileView(true):voice();document.getElementById('app').innerHTML=html;wire();updatePanel()}
  function wire(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const ac=el.dataset.action,id=el.dataset.id;if(ac==='nav')nav(el.dataset.page);else if(ac==='equip')equip(id);else if(ac==='cancel')cancel(id);else if(ac==='slot'){if(id){selectedId=id;document.getElementById('card-'+id)?.scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('card-'+id)?.classList.add('flash');setTimeout(()=>document.getElementById('card-'+id)?.classList.remove('flash'),800)}else document.querySelector('.title-list')?.scrollIntoView({behavior:'smooth'})}else if(ac==='back'){page=page==='honor'||page==='profile'||page==='other'||page==='voice'?'my':page==='title'||page==='medal'?'honor':'my';render()}else if(ac==='medalTab'){medalTab=el.dataset.tab;render()}else if(ac==='medalCard'){if(medalManage)medalToggle(Number(el.dataset.index));else{medalManage=true;render();toast('Manage your owned medals.')}}else if(ac==='medalSlot'){const worn=(account().medalWorn||[])[Number(el.dataset.index)];if(worn){medalManage=true;medalToggle(Number(worn.split('-')[1]))}else{medalManage=true;render();document.querySelector('.medal-list').scrollIntoView({behavior:'smooth',block:'center'})}}else if(ac==='medalManage'){medalManage=!medalManage;render()}else if(ac==='profileTab'){profileTab=el.dataset.tab;render()}else if(ac==='send'){const input=document.getElementById('messageInput');if(input&&input.value.trim())sendMessage(input.value.trim())}else if(ac==='noop')toast('This prototype entry is represented for navigation review.')}));}
  function updatePanel(){const a=account();document.getElementById('accountSelect').innerHTML=Object.entries(data.accounts).map(([k,v])=>`<option value="${k}" ${k===data.account?'selected':''}>${v.name}</option>`).join('');document.getElementById('scenarioSelect').innerHTML=Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${k===(a.scenario|| (data.account==='guest'?'empty':data.account==='legacy'?'over9':'wear3'))?'selected':''}>${v.label}</option>`).join('');const ex=document.getElementById('expireSelect');ex.innerHTML=(a.owned||[]).map(id=>`<option value="${id}">${titleName(id)}${a.expired.includes(id)?' (expired)':''}</option>`).join('')||'<option value="">No owned titles</option>';document.getElementById('oldList').textContent=(a.oldWorn||a.legacy||[]).map(titleName).join(' · ')||'Empty';document.getElementById('newList').textContent=a.worn.map(titleName).join(' · ')||'Empty';document.getElementById('testStatus').textContent=`${a.initialized?'Initialized':'Not initialized'} · ${a.worn.length}/9 worn · ${a.owned.length} owned · ${a.expired.length} expired · save fail ${failNext?'armed':'off'}`}
  function selectAccount(k){if(!data.accounts[k])return false;const ok=transaction(next=>{next.account=k},()=>{page='my'});if(ok){selectedId=null;render()}return ok}
  function upgrade(){const already=account().initialized;if(already){toast('Already initialized; current choices kept.');render();return false}return migrate()}
  function relogin(){try{const freshData=JSON.parse(localStorage.getItem(KEY));if(freshData)data=freshData}catch(e){}page='my';toast('Relogin complete. Saved choices kept.');render();return true}
  function failNextSave(){failNext=true;toast('Next update will simulate a save failure.');updatePanel();return true}
  function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
  function sendMessage(text){if(!text||!String(text).trim())return false;return transaction(next=>{const a=accountFrom(next);a.messages=[...(a.messages||[]),{text:String(text).trim(),snapshot:a.worn.slice(0,3)}]},()=>toast('Message sent with title snapshot.'))&&(render(),true)}
  window.prototypeAPI={getState:()=>JSON.parse(JSON.stringify({account:data.account,page,accounts:data.accounts,current:account()})),selectAccount,upgrade,equip,cancel,expire,relogin,failNextSave,reset,sendMessage,navigate:(p)=>{const ok=['my','honor','title','medal','profile','other','voice'].includes(p);if(ok){page=p;render()}return ok},scenarios:Object.fromEntries(Object.entries(scenarios).map(([k,v])=>[k,()=>applyScenario(k)])),applyScenario};
  document.getElementById('accountSelect').addEventListener('change',e=>selectAccount(e.target.value));document.getElementById('scenarioSelect').addEventListener('change',e=>applyScenario(e.target.value));document.getElementById('upgradeBtn').addEventListener('click',upgrade);document.getElementById('reloginBtn').addEventListener('click',relogin);document.getElementById('repeatBtn').addEventListener('click',upgrade);document.getElementById('expireBtn').addEventListener('click',()=>expire(document.getElementById('expireSelect').value));document.getElementById('failBtn').addEventListener('click',failNextSave);document.getElementById('resetBtn').addEventListener('click',reset);document.getElementById('cancelAllBtn').addEventListener('click',cancelAll);document.getElementById('expireSelect').addEventListener('change',e=>selectedId=e.target.value);document.querySelectorAll('[data-panel-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.panelNav)));render();
})();
</script></body></html>
